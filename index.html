<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微亿来 · 设备运营工作台</title><meta name="desk-release" content="2026-10-24-r12">
<style>
:root{
  --bg:#eef1f5;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--faint:#9aa0a6;
  --line:#e5e8ef;--blue:#0a84ff;--blue-bg:#e8f1ff;--green:#34c759;--green-bg:#e8f8ee;
  --orange:#ff9500;--orange-bg:#fff4e5;--red:#ff3b30;--red-bg:#ffeceb;
  --purple:#7c5cff;--purple-bg:#f0ecff;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 6px 24px rgba(0,0,0,.06);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

/* 登录 */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f5f7fb 0%,#e6ecf4 100%)}
.login-card{width:380px;max-width:92vw;background:#fff;border-radius:16px;padding:38px 34px 30px;box-shadow:0 20px 60px rgba(30,60,100,.14);text-align:center}
.login-card h1{font-size:22px;font-weight:700;color:#111;margin-bottom:6px}
.login-card .sub{color:var(--sub);font-size:13px;margin-bottom:26px}
.login-card input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:15px;margin-bottom:12px;background:#fafbfc;outline:none;transition:.2s;color:var(--ink)}
.login-card input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(10,132,255,.12)}
.login-card button{width:100%;height:46px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.login-card button:hover{background:#0071e3}
.login-card button:disabled{opacity:.55;cursor:not-allowed}
.login-err{margin-top:12px;min-height:18px;font-size:13px;color:var(--red)}

/* 布局 */
#app{display:none;height:100vh}
.layout{display:flex;height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:20px 20px 14px;font-size:16px;font-weight:700;color:#111;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sb-logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex-shrink:0}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--sub);font-size:14px;transition:.15s;margin-bottom:2px;position:relative}
.nav-item:hover{background:#f4f6fa;color:var(--ink)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:600}
.nav-badge{background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
.sb-user{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.sb-user .u-info{flex:1;min-width:0}
.sb-user .u-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .u-role{font-size:12px;color:var(--faint)}
.sb-user .logout{cursor:pointer;color:var(--faint);font-size:13px;padding:4px 6px;border-radius:6px}
.sb-user .logout:hover{color:var(--red);background:var(--red-bg)}
.main{flex:1;overflow-y:auto;padding:24px 28px;min-width:0}
.page-title{font-size:22px;font-weight:700;color:#111;margin-bottom:2px}
.page-desc{font-size:13px;color:var(--sub);margin-bottom:18px}

/* 组件 */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.kpi .label .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kpi .val{font-size:26px;font-weight:700;color:var(--ink)}
.kpi .sub{font-size:12px;color:var(--faint);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.card .c-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.card .c-head h3{font-size:15px;font-weight:600;color:var(--ink)}
.card .c-body{padding:16px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:#f7f9fc;color:var(--sub);font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfd}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-orange{background:var(--orange-bg);color:var(--orange)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}
.tag-gray{background:#f1f3f6;color:#6b7280}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#0071e3}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:#0a84ff;color:#fff}
.btn-green:hover{background:#2fb64f}
.btn-danger{background:#fff;color:var(--red);border:1px solid #ffd7d5}
.btn-danger:hover{background:var(--red-bg)}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{background:#e08a00}
.btn-ghost{background:#f1f3f6;color:var(--sub)}
.btn-ghost:hover{background:#e7eaf0;color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:12px}
.mb{margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px}
.empty{text-align:center;padding:36px 0;color:var(--faint)}
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-bar select,.link-btn{background:none;border:none;color:var(--accent,#0a84ff);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.filter-bar input{height:38px;border:1.5px solid var(--line);border-radius:9px;padding:0 12px;font-size:13px;background:#fff;color:var(--ink);outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--blue)}
.link-btn{background:none;border:none;color:var(--accent,#0a84ff);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.filter-bar input{width:200px}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:460px;max-width:94vw;max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:0 24px 70px rgba(0,0,0,.25);position:relative}
/* v13.61：窗口可拖动（拖顶部区域）+ 可调整大小 */
.modal.draggable{cursor:default;transition:none}
.modal.dragging{box-shadow:0 30px 90px rgba(0,0,0,.38);opacity:.97}
.modal-dragbar{position:absolute;top:0;left:0;right:0;height:38px;cursor:move;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;gap:6px;user-select:none;-webkit-user-select:none;touch-action:none}
.modal-dragbar::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:#d8dee9}
.modal-pin{width:22px;height:22px;border-radius:6px;border:1px solid #e2e8f0;background:#f8fafc;color:#94a3b8;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.modal-pin:hover{background:#eef2f7;color:#475569}
.modal-pin.on{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1}
.modal-resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
.modal-resize::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid #cbd5e1;border-bottom:2px solid #cbd5e1}
.modal-inner{padding-top:14px}
.modal h3{font-size:17px;font-weight:700;color:#111;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:500}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;height:42px;border:1.5px solid var(--line);border-radius:9px;padding:0 12px;font-size:14px;background:#fafbfc;outline:none;color:var(--ink);font-family:inherit}
.field textarea{height:80px;padding:10px 12px;resize:vertical}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(10,132,255,.1)}
.m-btns{display:flex;gap:10px;margin-top:20px}
.m-btns button{flex:1;height:44px}
.err{min-height:18px;font-size:13px;color:var(--red);margin-top:10px}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:300;background:#111;color:#fff;padding:11px 22px;border-radius:99px;font-size:13px;transition:.35s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#d23c32}
.toast.ok{background:#1e9e4c}

.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 18px;border-radius:99px;border:1.5px solid var(--line);background:#fafbfc;font-size:13px;cursor:pointer;transition:.15s;color:var(--ink);user-select:none}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
/* 申请卡 */
.req-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff}
.req-item .r-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.req-item .r-type{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.req-item .r-desc{font-size:13px;color:var(--sub);margin-bottom:8px}
.req-item .r-actions{display:flex;gap:8px;flex-wrap:wrap}
.req-note{font-size:12px;color:var(--faint);margin-top:6px}

/* 响应式 */
/* v13.61：手机端极简拍照（全屏取景 + 一键快门） */
#snapWrap{position:fixed;inset:0;background:#000;z-index:9998;display:none;flex-direction:column}
#snapWrap.on{display:flex}
#snapVideo{flex:1;width:100%;height:100%;object-fit:cover;background:#000}
.snap-top{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);color:#fff;font-size:15px;font-weight:600}
.snap-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer}
.snap-bottom{position:absolute;bottom:0;left:0;right:0;padding:20px 0 34px;display:flex;justify-content:center;align-items:center;gap:28px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.snap-btn{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#111;transition:transform .1s}
.snap-btn:active{transform:scale(.92)}
.snap-side{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.snap-tip{position:absolute;bottom:132px;left:0;right:0;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.8);padding:0 20px}
.snap-prog{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);color:#fff;padding:22px 30px;border-radius:14px;font-size:15px;text-align:center;min-width:230px}
.snap-bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:14px;overflow:hidden}
.snap-bar>i{display:block;height:100%;width:0;background:#4ade80;border-radius:3px;transition:width .3s}
/* v13.63：识别候选选择（手机端大按钮） */
.snap-cand{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;transition:all .12s}
.snap-cand:active{transform:scale(.99)}
.snap-cand.on{border-color:#7c5cff;background:#f5f2ff;box-shadow:0 0 0 2px rgba(124,92,255,.15)}
.snap-cand-txt{flex:1;font-size:16px;font-weight:600;letter-spacing:.5px;word-break:break-all;font-family:Consolas,Monaco,monospace}
.snap-cand.on .snap-cand-txt{color:#5b3fd1}
.snap-cand-tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef2ff;color:#4f46e5;font-weight:600;white-space:nowrap}
.snap-cand-ck{font-size:18px;color:#94a3b8;line-height:1}
.snap-cand.on .snap-cand-ck{color:#7c5cff}
@media(max-width:900px){
  .sidebar{width:60px}
  .sb-logo span,.nav-item span:not(.nav-badge){display:none}
  .nav-item{justify-content:center;padding:12px 0}
  .sb-user .u-info,.sb-user .logout{display:none}
  .main{padding:12px}
  /* v13.5：手机表格横向滚动看全列（表格保持内容宽度，容器内滑动） */
  .card table{min-width:max-content;width:100%}
  .card table th,.card table td{white-space:nowrap;padding:7px 9px}
  table{font-size:12px}
  .kpi-row{flex-wrap:wrap}
  .m-btns{flex-wrap:wrap}
  .filter-bar input{width:100%;max-width:240px}
  .chip{padding:7px 12px;font-size:12px}
  .modal{padding:20px 16px}
}
/* v13.48：电话卡绑定设备可搜索下拉（替代原生 select 滚动） */
.ss-wrap{position:relative}
.ss-input{width:100%;box-sizing:border-box;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;background:#fff}
.ss-input:focus{outline:none;border-color:var(--accent)}
.ss-list{position:absolute;z-index:80;top:calc(100% + 4px);left:0;right:0;max-height:260px;overflow:auto;background:#fff;border:1.5px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.ss-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f1f1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-item:last-child{border-bottom:none}
.ss-item:hover{background:var(--bg2)}
.ss-item.ss-sel{background:var(--accent-bg);color:var(--accent);font-weight:600}
</style>

function ubtoa(s){var b=[],i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);if(c<128)b.push(c);else if(c<2048)b.push(192|(c>>6),128|(c&63));else b.push(224|(c>>12),128|((c>>6)&63),128|(c&63));}return btoa(String.fromCharCode.apply(null,b));}
function uatob(s){var bin=atob(s),b=[],i=0,j=0,r="";for(j=0;j<bin.length;j++)b.push(bin.charCodeAt(j));while(i<b.length){var c=b[i];if(c<128){r+=String.fromCharCode(c);i++;}else if(c<224){r+=String.fromCharCode(((c&31)<<6)|(b[i+1]&63));i+=2;}else{r+=String.fromCharCode(((c&15)<<12)|((b[i+1]&63)<<6)|(b[i+2]&63));i+=3;}}return r;}

// v13.41：导出 Excel（CSV with BOM，Excel 双击打开中文不乱码）
function exportCSV(filename, headers, rows){
  var lines=[headers.join(",")];
  (rows||[]).forEach(function(r){
    lines.push(r.map(function(v){
      var s=String(v==null?"":v);
      if(/[",\n]/.test(s))s="\""+s.replace(/"/g,"\"\"")+"\"";
      return s;
    }).join(","));
  });
  var blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

  if(!d||!d.fields)return;

  // v13.3：平台列改名+选项（抖音/快手/小红书）；是否有抖音号改"是/否"快捷选择
  var pf=d.fields.find(function(x){return x.label==="抖音平台";});

  // v13.27：平台字段选项统一含"空"（兼容云端已改名但缺"空"的情况）
  var pf2=d.fields.find(function(x){return x.id==="platform";});

  var idf=d.fields.find(function(x){return x.label==="抖音ID";});

  var mf=d.fields.find(function(x){return x.label==="手机型号"&&x.type==="input";});
  if(mf){mf.type="select";mf.options=["iPhone 13","iPhone 14","iPhone 15","Mate60","Mate60 Pro","Redmi K70","其他"];mf.placeholder="";}
  DEFAULT_FIELDS.forEach(function(f){
    // v13.4：按 id 匹配（label 曾重复导致重复 push）

// v13.64：账号/密码输入容错——全角转半角、去空格、账号大小写不敏感
function normAcct(s){
  s=String(s==null?"":s);
  s=s.replace(/[\uFF01-\uFF5E]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  s=s.replace(/\u3000/g," ");
  return s.replace(/\s+/g,"").toLowerCase();
}
function normPwd(s){
  s=String(s==null?"":s);
  s=s.replace(/[\uFF01-\uFF5E]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  s=s.replace(/\u3000/g," ");
  return s.trim();
}
function postLogin(b){
  var un=normAcct(b.username), pw=normPwd(b.password);
  var hit=D.users.filter(function(x){return normAcct(x.username)===un;});
  // v13.64：区分"账号不存在"和"密码错误"，避免误判
  if(!hit.length)return[400,{error:"账号不存在：没有「"+String(b.username||"").trim()+"」这个账号。若刚建的号，请确认已同步到本机"+(window.CLOUD_OK===false?"（本机未连上云端）":"")+""}];
  var u=null;
  for(var i=0;i<hit.length;i++){if(normPwd(hit[i].password)===pw){u=hit[i];break;}}
  if(!u)return[400,{error:"密码错误：账号「"+hit[0].username+"」存在，密码不对（注意大小写/空格）"}];
  var tk=ubtoa(JSON.stringify({id:u.id}))+"."+ubtoa("s1");
  return[200,{token:tk,user:{id:u.id,name:u.name,role:u.role,username:u.username}}];
}

// 本地时间字符串(YYYY-MM-DDTHH:MM)，与 datetime-local 同格式，避免 UTC 时区偏差
function nowLocalStr16(){
  var d=new Date();
  function p(n){return (n<10?"0":"")+n;}
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
}
function getNotices(tk){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  var now=nowLocalStr16();
  var list=(D.notices||[]).filter(function(n){
    // 定时任务：到时间才可见
    if(n.publish_at&&n.publish_at>now)return false;
    // 范围：all=全部员工，leader:<id>=指定组长组，user:<id>=指定员工
    if(n.target==="all")return true;
    if(n.target.indexOf("leader:")===0){
      var lid=n.target.slice(7);
      if(u.role==="leader")return u.id===lid;
      if(u.role==="member")return u.parent_id===lid;
      return true; // 主管可见所有组
    }
    if(n.target.indexOf("user:")===0){
      return n.target.slice(5)===u.id;
    }
    return true;
  });
  list=list.map(function(n){
    return Object.assign({},n,{acked:(n.acked||[]).indexOf(u.id)>=0});
  });
  return[200,{notices:list}];
}

  if(u.role==="leader"&&target.indexOf("leader:")===0&&target.slice(7)!==u.id)return[403,{error:"组长只能通知本组员工"}];

function postRequest(tk,b){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  var type=b.type;
  if(["take","repair","return","delete","edit","ship","sim_take","sim_return","sim_transfer"].indexOf(type)<0)return[400,{error:"类型不合法"}];
  // v13.7：电话卡领用/退回申请（sim_take/sim_return）；v13.9：转卡（sim_transfer）
  if(type==="sim_take"||type==="sim_return"||type==="sim_transfer"){
    var s=(D.simcards||[]).find(function(x){return x.id===b.sim_id;});
    if(!s)return[404,{error:"电话卡不存在"}];
    if(type==="sim_take"){
      if(s.data.sim_status!=="在库"||s.user_id)return[400,{error:"卡不在库，无法申请领用"}];
    }else if(type==="sim_return"){
      if(s.data.sim_status!=="在用")return[400,{error:"卡未在使用中"}];
      if(u.role==="member"&&s.user_id!==u.id)return[403,{error:"只能退回自己领用的卡"}];
    }else{ // sim_transfer
      if(s.data.sim_status!=="在用")return[400,{error:"卡未在使用中"}];
      if(s.user_id!==u.id)return[403,{error:"只能转让自己领用的卡"}];
      var toU=D.users.find(function(x){return x.id===b.to_user_id;});
      if(!toU||toU.role!=="member")return[400,{error:"接收员工不存在"}];
      if(toU.id===u.id)return[400,{error:"不能转让给自己"}];
    }
    if(D.requests.find(function(x){return x.type===type&&x.sim_id===s.id&&x.user_id===u.id&&x.status==="pending";}))return[400,{error:"已有待审核的同类型申请"}];
    D.requests.push({id:uid(),type:type,sim_id:s.id,asset_id:"",asset_name:(s.data.sim_no||"电话卡"),user_id:u.id,user_name:u.name,status:"pending",created:nowStr(),desc:b.desc||"",return_reason:b.return_reason||"",return_note:b.return_note||"",to_user_id:b.to_user_id||"",to_user_name:(type==="sim_transfer"?(D.users.find(function(x){return x.id===b.to_user_id;})||{}).name||"":"")});
    // v13.58：自动通过审核（开关打开时员工申请提交即通过）
    if(u.role==="member"&&D.settings&&D.settings.auto_approve){
      var rq=D.requests[D.requests.length-1];
      executeApprove(rq,"自动审核");
    }
    sv();return[200,{ok:true}];
  }
  var a=D.assets.find(function(x){return x.id===b.asset_id;});
  if(!a||a.status==="deleted")return[404,{error:"设备不存在"}];
  // v12.11：外寄中的手机禁止退回/报修/删除/修改申请，只能先寄回
  if(a.status==="shipped"&&type!=="edit")return[400,{error:"手机外寄中，请先确认寄回后再操作"}];
  // 校验
  if(type==="take"){
    if(a.status!=="available")return[400,{error:"设备不在库，无法申请领用"}];
    if(D.uses.find(function(x){return x.asset_id===a.id&&!x.return_time;}))return[400,{error:"设备已被领用"}];
  }
  if(type==="return"){
    if(a.status!=="in_use")return[400,{error:"设备未在使用中"}];
  }
  // v13.14：员工寄出申请（需审核）；主管/组长走直接寄出接口
  if(type==="ship"){
    if(!b.to_where||!String(b.to_where).trim())return[400,{error:"请填写寄给谁/地址"}];
    if(a.status!=="in_use")return[400,{error:"只有在用的设备可申请寄出"}];
    var shipUse=D.uses.find(function(x){return x.asset_id===a.id&&!x.return_time;});
    if(!shipUse||shipUse.user_id!==u.id)return[403,{error:"只能申请寄自己正在用的手机"}];
  }
  if(type==="repair"&&!b.desc)return[400,{error:"请描述故障"}];
  if(type==="delete"&&!b.reason)return[400,{error:"请填写删除原因"}];
  if(type==="edit"){if(!b.field||b.new_value===undefined)return[400,{error:"参数不完整"}];}
  // 重复待审检查
  if(D.requests.find(function(x){return x.type===type&&x.asset_id===a.id&&x.user_id===u.id&&x.status==="pending";}))return[400,{error:"已有待审核的同类型申请"}];
  D.requests.push({id:uid(),type:type,asset_id:a.id,asset_name:assetName(a),user_id:u.id,user_name:u.name,desc:b.desc||"",reason:b.reason||"",note:"",return_reason:b.return_reason||"",return_note:b.return_note||"",to_where:b.to_where||"",ship_reason:b.ship_reason||"",tracking:b.tracking||"",status:"pending",created:nowStr(),handled_by:"",handled_at:"",field:b.field||"",new_value:b.new_value||""});
  // v13.58：自动通过审核（开关打开时员工申请提交即通过）
  if(u.role==="member"&&D.settings&&D.settings.auto_approve){
    var rq=D.requests[D.requests.length-1];
    executeApprove(rq,"自动审核");
  }
  sv();return[200,{ok:true}];
}
// v13.58：自动通过审核核心逻辑（approveRequest 与自动审核共用），operatorName=审核人（自动=“自动审核”）
function executeApprove(r,operatorName){
  // v13.7：电话卡领用/退回审核；v13.9：转卡审核
  if(r.type==="sim_take"||r.type==="sim_return"||r.type==="sim_transfer"){
    var s=r.sim_id?(D.simcards||[]).find(function(x){return x.id===r.sim_id;}):null;
    if(r.type==="sim_take"){
      if(!s||s.data.sim_status!=="在库")return[400,{error:"卡状态已变化，无法通过"}];
      s.data.sim_status="在用";s.user_id=r.user_id;s.user_name=r.user_name;
      // v13.12：再次领用后清除退回原因/备注
      delete s.data.return_reason;delete s.data.return_note;
    }else if(r.type==="sim_return"){
      if(!s)return[404,{error:"卡不存在"}];
      s.data.sim_status="在库";delete s.user_id;delete s.user_name;
      // v13.12：退回原因/备注同步到卡数据（所有页面一直显示）
      if(r.return_reason)s.data.return_reason=r.return_reason;
      if(r.return_note)s.data.return_note=r.return_note;
    }else{
      if(!s)return[404,{error:"卡不存在"}];
      var toU=D.users.find(function(x){return x.id===r.to_user_id;});
      if(!toU)return[400,{error:"接收员工不存在"}];
      s.user_id=toU.id;s.user_name=toU.name;
    }
    r.status="approved";r.handled_by=operatorName;r.handled_at=nowStr();
    sv();return[200,{ok:true}];
  }
  var a=D.assets.find(function(x){return x.id===r.asset_id;});
  // v13.14：寄出申请审核（员工寄出需主管/组长同意）
  if(r.type==="ship"){
    if(!a||a.status!=="in_use")return[400,{error:"设备状态已变化，无法通过"}];
    a.status="shipped";
    D.shipments=(D.shipments||[]).concat([{
      id:uid(),status:"shipped",asset_id:a.id,asset_name:assetName(a),user_id:r.user_id,user_name:r.user_name,
      to_where:r.to_where||"",reason:r.ship_reason||r.reason||"",tracking:r.tracking||"",
      // v13.22：寄出时间=员工点击寄出（提交申请）的时间，不是审核时间
      ship_time:r.created||nowStr(),return_time:"",return_by:"",note:r.note||"",seen:false
    }]);
    r.status="approved";r.handled_by=operatorName;r.handled_at=nowStr();
    sv();return[200,{ok:true}];
  }
  if(r.type==="take"){
    if(!a||a.status!=="available")return[400,{error:"设备状态已变化，无法通过"}];
    a.status="in_use";
    // v13.12：再次领用后清除退回原因/备注
    if(a.data){delete a.data.return_reason;delete a.data.return_note;}
    D.uses.push({id:uid(),asset_id:a.id,asset_name:assetName(a),user_id:r.user_id,user_name:r.user_name,take_time:nowStr(),return_time:"",take_req:r.id});
  }else if(r.type==="return"){
    if(!a)return[404,{error:"设备不存在"}];
    var rec=D.uses.find(function(x){return x.asset_id===a.id&&!x.return_time&&x.user_id===r.user_id;});
    if(rec)rec.return_time=nowStr();
    if(a.status==="in_use")a.status="available";
    // v13.12：退回原因/备注同步到设备数据（所有页面一直显示）
    if(r.return_reason)a.data.return_reason=r.return_reason;
    if(r.return_note)a.data.return_note=r.return_note;
  }else if(r.type==="repair"){
    if(!a)return[404,{error:"设备不存在"}];
    if(a.status!=="repairing")a.status="repairing";
    D.repairs.push({id:uid(),asset_id:a.id,asset_name:assetName(a),user_id:r.user_id,user_name:r.user_name,desc:r.desc,status:"repairing",created:nowStr(),updated:nowStr()});
  }else if(r.type==="delete"){
    if(!a)return[404,{error:"设备不存在"}];
    a.status="deleted";
  }else if(r.type==="edit"){
    if(!a)return[404,{error:"设备不存在"}];
    if(!a.data)a.data={};
    a.data[r.field]=r.new_value;
  }
  // v13.22：操作日志
  if(a&&r.type==="take")addLog(a.id,"领用","审核通过领用申请",operatorName);
  else if(a&&r.type==="return")addLog(a.id,"归还","审核通过退还申请"+(r.return_reason?"（"+r.return_reason+"）":""),operatorName);
  else if(a&&r.type==="repair")addLog(a.id,"报修","审核通过报修："+r.desc,operatorName);
  else if(a&&r.type==="delete")addLog(a.id,"删除","审核通过删除申请"+(r.reason?"（"+r.reason+"）":""),operatorName);
  else if(a&&r.type==="edit")addLog(a.id,"修改","审核通过修改"+r.field+"→"+r.new_value,operatorName);
  r.status="approved";r.handled_by=operatorName;r.handled_at=nowStr();
  sv();return[200,{ok:true}];
}

function batchRequest(tk,b){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  if(u.role!=="supervisor"&&u.role!=="leader")return[403,{error:"无权限"}];
  var ids=b.ids||[],action=b.action,note=b.note||"";

function batchAssign(tk,b){

  var ids=b.asset_ids||[];
  var target=D.users.find(function(x){return x.id===b.user_id;});

  a.status="in_use";

    ok++;
  });

function getAssetLogs(tk,id){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  var a=D.assets.find(function(x){return x.id===id;});
  if(!a)return[404,{error:"设备不存在"}];
  var logs=[];
  // 登记
  logs.push({action:"登记",desc:"设备登记入库",user:a.created_by_name||"",time:a.created||""});
  // 领用/归还（uses）
  (D.uses||[]).forEach(function(x){
    if(x.asset_id!==id)return;
    if(x.take_time)logs.push({action:"领用",desc:"领用设备",user:x.user_name||"",time:x.take_time});
    if(x.return_time)logs.push({action:"归还",desc:"归还仓库",user:x.user_name||"",time:x.return_time});
  });
  // 外寄（shipments）
  (D.shipments||[]).forEach(function(x){
    if(x.asset_id!==id)return;
    if(x.ship_time)logs.push({action:"寄出",desc:"寄出→"+(x.to_where||"")+(x.reason?"（"+x.reason+"）":"")+(x.tracking?" 单号"+x.tracking:""),user:x.ship_by_name||x.user_name||"",time:x.ship_time});
    if(x.return_time)logs.push({action:"寄回",desc:"确认寄回",user:x.return_by||"",time:x.return_time});
  });
  // 维修（repairs）
  (D.repairs||[]).forEach(function(x){
    if(x.asset_id!==id)return;
    if(x.created)logs.push({action:"报修",desc:x.desc||"报修",user:x.user_name||"",time:x.created});
    if(x.fixed_at)logs.push({action:"修复",desc:"维修完成",user:x.handled_by||"",time:x.fixed_at});
  });
  // 转让（transfers）
  (D.transfers||[]).forEach(function(x){
    if(x.asset_id!==id)return;
    if(x.created)logs.push({action:"转让",desc:x.from_name+" → "+x.to_name+(x.handled_at?"（已确认）":"（待确认）"),user:x.from_name||"",time:x.created});
  });
  // 删除/报废申请（requests）
  (D.requests||[]).forEach(function(r){
    if(r.asset_id!==id)return;
    if(r.type==="delete"&&r.created)logs.push({action:"删除申请",desc:r.reason||"删除",user:r.user_name||"",time:r.created});
  });
  // 操作日志（logs）
  (D.logs||[]).forEach(function(l){
    if(l.asset_id!==id)logs.push({action:l.action,desc:l.desc,user:l.user,time:l.time});
  });
  // 去重+排序（时间正序）
  logs.sort(function(a,b){return String(a.time||"").localeCompare(String(b.time||""));});
  return[200,{logs:logs}];
}

    ok++;
  });
  if(!ok)return[400,{error:"所选设备都不可领用"}];
  sv();return[200,{ok:true,submitted:ok,failed:fail}];
}

  });

  }}];
}

var _of=window.fetch;
window.fetch=function(url,opts){
  var us=(typeof url==="string")?url:(url.url||url.toString());
  if(us.indexOf("/api/")===0){
    opts=opts||{};var method=opts.method||"GET";var body=opts.body?JSON.parse(opts.body):null;
    var tk="";var ah=opts.headers||{};
    if(ah.Authorization&&ah.Authorization.indexOf("Bearer ")==0){tk=ah.Authorization.slice(7);}
    var res=route(method,us,tk,body);
    return Promise.resolve({ok:res[0]<400,status:res[0],json:function(){return Promise.resolve(res[1]);}});
  }
  return _of.apply(this,arguments);
};

// v13.61：弹窗支持拖动 + 调整大小（拖顶部把手移动，右下角拉伸）
var MODAL_PINNED=false, MODAL_POS={x:0,y:0}, MODAL_SIZE={w:0,h:0};
function showModal(h){
  var inner=document.getElementById("modalInner");
  if(inner)inner.innerHTML=h;else document.getElementById("modalBody").innerHTML=h;
  var m=document.getElementById("modalMask");
  m.style.display="flex";
  var box=document.getElementById("modalBody");
  // 重置位置/尺寸，让每个新弹窗居中显示（除非已固定）
  if(!MODAL_PINNED){box.style.transform="";box.style.margin="";MODAL_POS={x:0,y:0};}
  if(MODAL_SIZE.w){box.style.width=MODAL_SIZE.w+"px";}
  if(MODAL_SIZE.h){box.style.maxHeight=MODAL_SIZE.h+"px";}
  requestAnimationFrame(function(){initModalDrag();});
}
function closeModal(){
  document.getElementById("modalMask").style.display="none";
  var box=document.getElementById("modalBody");
  if(box){box.style.transform="";box.classList.remove("dragging");}
  MODAL_PINNED=false;
  var pin=document.getElementById("modalPin");if(pin)pin.classList.remove("on");
  MODAL_POS={x:0,y:0};
}
function toggleModalPin(e){
  if(e)e.stopPropagation();
  MODAL_PINNED=!MODAL_PINNED;
  var pin=document.getElementById("modalPin");
  if(pin)pin.classList.toggle("on",MODAL_PINNED);
  toast(MODAL_PINNED?"已固定窗口位置":"已取消固定");
}
function initModalDrag(){
  var bar=document.getElementById("modalDragbar"),box=document.getElementById("modalBody");
  if(!bar||!box)return;
  box.classList.add("draggable");   // v13.61：每次打开都确保可拖动标记（在 __bound 判断之外）
  if(bar.__bound)return;
  bar.__bound=true;
  var dragging=false,startX=0,startY=0,baseX=0,baseY=0;
  function down(e){
    if(e.target.classList&&e.target.classList.contains("modal-pin"))return;
    var p=e.touches?e.touches[0]:e;
    dragging=true;
    startX=p.clientX;startY=p.clientY;baseX=MODAL_POS.x;baseY=MODAL_POS.y;
    box.classList.add("dragging");
    // 拖动时改为绝对偏移，避免与居中冲突
    box.style.transform="translate("+baseX+"px,"+baseY+"px)";
    document.addEventListener("mousemove",move,{passive:false});
    document.addEventListener("touchmove",move,{passive:false});
    document.addEventListener("mouseup",up);
    document.addEventListener("touchend",up);
    e.preventDefault();
  }
  function move(e){
    if(!dragging)return;
    var p=e.touches?e.touches[0]:e;
    var dx=p.clientX-startX,dy=p.clientY-startY;
    // 视口边界限制（用固定尺寸计算，避免 rect 受 transform 影响而漂移）
    var bw=box.offsetWidth||box.clientWidth||400;
    var bh=Math.min(box.offsetHeight||box.clientHeight||400,window.innerHeight);
    var maxX=Math.max(0,(window.innerWidth-bw)/2-10);
    var maxY=Math.max(0,(window.innerHeight-bh)/2-10);
    var nx=Math.max(-maxX,Math.min(maxX,baseX+dx));
    var ny=Math.max(-maxY,Math.min(maxY,baseY+dy));
    MODAL_POS.x=nx;MODAL_POS.y=ny;
    box.style.transform="translate("+nx+"px,"+ny+"px)";
    if(e.cancelable)e.preventDefault();
  }
  function up(){
    dragging=false;
    box.classList.remove("dragging");
    document.removeEventListener("mousemove",move);
    document.removeEventListener("touchmove",move);
    document.removeEventListener("mouseup",up);
    document.removeEventListener("touchend",up);
  }
  bar.addEventListener("mousedown",down);
  bar.addEventListener("touchstart",down,{passive:false});
  // 右下角调整大小
  var rz=document.getElementById("modalResize");
  if(rz&&!rz.__bound){
    rz.__bound=true;
    var rs=false,sx=0,sy=0,sw=0,sh=0;
    function rdown(e){
      var p=e.touches?e.touches[0]:e;
      rs=true;sx=p.clientX;sy=p.clientY;
      var r=box.getBoundingClientRect();sw=r.width;sh=r.height;
      document.addEventListener("mousemove",rmove);
      document.addEventListener("touchmove",rmove,{passive:false});
      document.addEventListener("mouseup",rup);
      document.addEventListener("touchend",rup);
      e.preventDefault();e.stopPropagation();
    }
    function rmove(e){
      if(!rs)return;
      var p=e.touches?e.touches[0]:e;
      var w=Math.max(300,Math.min(window.innerWidth-40,sw+(p.clientX-sx)));
      var h=Math.max(200,Math.min(window.innerHeight-60,sh+(p.clientY-sy)));
      MODAL_SIZE.w=w;MODAL_SIZE.h=h;
      box.style.width=w+"px";box.style.maxHeight=h+"px";
      if(e.cancelable)e.preventDefault();
    }
    function rup(){
      rs=false;
      document.removeEventListener("mousemove",rmove);
      document.removeEventListener("touchmove",rmove);
      document.removeEventListener("mouseup",rup);
      document.removeEventListener("touchend",rup);
    }
    rz.addEventListener("mousedown",rdown);
    rz.addEventListener("touchstart",rdown,{passive:false});
  }
}

async function refreshBadges(){
  try{
    var data=await apiGet("/api/stats");

    var set=function(id,n){var el=document.getElementById("badge_"+id);if(el){if(n>0){el.style.display="flex";el.textContent=n;}else{el.style.display="none";}}};
    if(STATE.user.role==="supervisor"||STATE.user.role==="leader"){
      set("review",pending);
      // v12.9/12.11：领用记录角标 = 未读转让 + 未读外寄（上级收到通知，不用审核）
      try{
        var unTf=await apiGet("/api/transfers/unseen");
        var unSh=await apiGet("/api/shipments/unseen");
        set("uses",(unTf.count||0)+(unSh.count||0));
      }catch(e){set("uses",0);}
    }
    else{
      // v12.8：我的申请角标 = 我的申请 + 待我确认的转让
      try{
        var tf=await apiGet("/api/transfers");
        var waitMe=(tf.transfers||[]).filter(function(t){return t.status==="pending"&&t.to_id===STATE.user.id;}).length;
        set("mymain",myP+waitMe);
      }catch(e){set("mymain",myP);}
      // v13.33：我的电话卡角标 = 待签到数量；v13.53：+ 待填存放手机数量
      try{
        var st=await apiGet("/api/settings");
        if(st.settings&&st.settings.checkin_enabled){
          var sd=await apiGet("/api/sims");
          var need=0,needBind=0;
          (sd.sims||[]).forEach(function(x){
            if((x.data||{}).sim_status==="在用"&&simNeedCheckin(x))need++;
            if(x.user_id===STATE.user.id&&simNeedBind(x))needBind++;
          });
          set("sims",need+needBind);
        }else{
          // 签到关闭时仅显示待填存放手机数
          try{
            var sd2=await apiGet("/api/sims");
            var needBind2=0;
            (sd2.sims||[]).forEach(function(x){if(x.user_id===STATE.user.id&&simNeedBind(x))needBind2++;});
            set("sims",needBind2);
          }catch(e){set("sims",0);}
        }
      }catch(e){set("sims",0);}
    }
  }catch(e){}
}

function shipDays(t1,t2){
  try{
    var d1=new Date(t1.replace(/-/g,"/"));if(isNaN(d1))return "";

    var defs=[["","全部"],["take","领用"],["sim_take","领卡"],["return","退还"],["sim_return","退卡"],["ship","寄出"],["repair","报修"],["delete","删除"],["edit","修改"],["sim_transfer","转卡"]];
    var h="<span style=\"font-size:12px;color:var(--faint);line-height:28px\">已处理分类：</span>";

      var n=d[0]===""?done.length:(cntType[d[0]]||0);
      if(d[0]!==""&&n===0)return;
      h+="<span class=\"chip"+(REVIEW_DONE_TYPE===d[0]?" on":"")+"\" data-v=\""+d[0]+"\" onclick=\"filterReviewDoneType(this)\">"+d[1]+" ("+n+")</span>";

  };
var pending=data.requests.filter(function(r){return r.status==="pending"&&flt(r);});
// v13.20：已处理记录独立筛选（类型/员工，与待处理分开）
var done=data.requests.filter(function(r){
  if(r.status==="pending")return false;

});

  pending.forEach(function(r){
    var detail=r.type==="repair"?("故障："+esc(r.desc)):(r.type==="delete"?("原因："+esc(r.reason)):(r.type==="edit"?("修改："+esc(r.field==="model"?"手机型号":"手机编号")+" → "+esc(r.new_value)):(r.type==="sim_transfer"?("转给："+esc(r.to_user_name||"—")):(r.type==="ship"?("寄往："+esc(r.to_where||"—")+(r.ship_reason?" · "+esc(r.ship_reason):"")):""))));
    h+="<div class=\"req-item\" style=\"display:flex;gap:10px;align-items:flex-start\"><input type=\"checkbox\" class=\"req-chk\" value=\""+r.id+"\" style=\"margin-top:5px;flex-shrink:0\" onchange=\"updateSelCount()\"><div style=\"flex:1\"><div class=\"r-top\">"+reqTypeTag(r.type)+"<b>"+esc(r.asset_name)+"</b><span style=\"color:var(--faint);font-size:12px\">"+esc(r.user_name)+" · "+esc(r.created)+"</span></div>"
      +(detail?"<div class=\"r-desc\">"+detail+"</div>":"")
      +"<div class=\"r-actions\"><button class=\"btn btn-sm btn-green\" onclick=\"handleReq('"+r.id+"','approve')\">✔ 同意</button><button class=\"btn btn-sm btn-danger\" onclick=\"handleReq('"+r.id+"','reject')\">✘ 不同意</button></div></div></div>";
  });
  document.getElementById("reviewBody").innerHTML=h;
  var h2="";
  if(!done.length)h2="<div class=\"empty\">暂无处理记录</div>";
  done.forEach(function(r){
    h2+="<div class=\"req-item\"><div class=\"r-top\">"+reqTypeTag(r.type)+"<b>"+esc(r.asset_name)+"</b>"+reqStatusTag(r.status)+"<span style=\"color:var(--faint);font-size:12px\">"+esc(r.user_name)+" · "+esc(r.created)+"</span></div>"
      +"<div class=\"r-note\">处理人："+esc(r.handled_by||"—")+" · "+esc(r.handled_at||"—")+(r.note?" · 备注："+esc(r.note):"")+"</div></div>";
  });
  document.getElementById("reviewHistory").innerHTML=h2;
}
function toggleAll(){var all=document.getElementById("selAll").checked;Array.prototype.forEach.call(document.querySelectorAll(".req-chk"),function(c){c.checked=all;});updateSelCount();}
function updateSelCount(){var el=document.getElementById("selCount");if(el){var n=document.querySelectorAll(".req-chk:checked").length;el.textContent=n?("已选 "+n+" 条"):"";}}
function selectedIds(){return Array.prototype.map.call(document.querySelectorAll(".req-chk:checked"),function(c){return c.value;});}
async function batchHandle(action){
  var ids=selectedIds();
  if(!ids.length){toast("请先勾选要处理的申请","err");return;}
  var note="";
  if(action==="reject"){note=prompt("批量拒绝原因（可选）：")||"";}
  else{note=prompt("备注（可选）：")||"";}
  try{
    var r=await apiPost("/api/requests/batch",{ids:ids,action:action,note:note});
    toast(action==="approve"?"✔ 已批量同意 "+r.count+" 条":"✘ 已批量拒绝 "+r.count+" 条");
    renderReviewList();refreshBadges();
  }catch(e){toast(e.message,"err");}
}
function handleReq(id,action){
  if(action==="approve"){
    showModal("<h3>通过申请</h3><div style=\"font-size:14px;color:var(--sub);margin-bottom:14px\">确认同意该申请？</div>"
      +"<div class=\"field\"><label>备注（可选）</label><input id=\"rj_note\" placeholder=\"填写处理备注\"></div>"
      +"<div class=\"m-btns\"><button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消</button><button class=\"btn btn-green\" onclick=\"submitHandle('"+id+"','approve')\">确认同意</button></div><div class=\"err\" id=\"rj_err\"></div>");
  }else{
    showModal("<h3>拒绝申请</h3><div style=\"font-size:14px;color:var(--sub);margin-bottom:14px\">确认不同意该申请？可填写原因告知员工</div>"

      +"<div class=\"m-btns\"><button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消</button><button class=\"btn btn-danger\" onclick=\"submitHandle('"+id+"','reject')\">确认拒绝</button></div><div class=\"err\" id=\"rj_err\"></div>");
  }
}
async function submitHandle(id,action){
  var note=document.getElementById("rj_note")?document.getElementById("rj_note").value.trim():"";
  try{
    await apiPost("/api/requests/"+id,{action:action,note:note});

  }catch(e){var el=document.getElementById("rj_err");if(el)el.textContent=e.message;}
}

function assetFullHtml(a, fields){
  var d=a.data||{};

}

async function renderAssetTable(){

  var f=document.getElementById("astFilter")?document.getElementById("astFilter").value:"";

  var userMatch=function(a){if(!ASSET_FILTER)return true;var u2=(useData.uses||[]).find(function(x){return x.asset_id===a.id&&!x.return_time;});return u2&&u2.user_id===ASSET_FILTER;};
  // v13.55：按组过滤（主管）——只看该组（组长+组员）登记的设备
  var groupMatch=function(a){
    if(!ASSET_GROUP||STATE.user.role!=="supervisor")return true;
    if(ASSET_GROUP==="direct")return D.users.some(function(x){return x.role==="member"&&x.parent_id===STATE.user.id&&x.id===a.created_by;});
    return a.created_by===ASSET_GROUP||D.users.some(function(x){return x.role==="member"&&x.parent_id===ASSET_GROUP&&x.id===a.created_by;});
  };
  // v13.28：按平台过滤（抖音/快手/小红书 多选匹配，空=未选平台）
  var platMatch=function(a){
    if(!ASSET_PLATFORM)return true;
    var wp=((a.data&&a.data.platform)||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(ASSET_PLATFORM==="空")return !wp.length;
    return wp.indexOf(ASSET_PLATFORM)>=0;
  };
  var list=data.assets.filter(function(a){return userMatch(a)&&groupMatch(a)&&platMatch(a)&&(!f||a.status===f)&&(!kw||(assetName(a)+" "+(a.data&&a.data.sn||"")+" "+(a.data&&a.data.model||"")+" "+(a.data&&a.data.phone||"")+" "+(a.data&&a.data.nickname||"")+" "+(a.data&&a.data.douyin_id||"")+" "+(a.data&&a.data.note||"")+" "+a.created_by_name).indexOf(kw)>=0);});
  var h="";

    var showUser=myUse?myUse.user_name:(a.status==="available"?inStockOwner(a.created_by):"");

    var extraTds="";
    var isMine=STATE.user.role==="member"&&myUse&&myUse.user_id===STATE.user.id;
    (fieldsData.fields||[]).forEach(function(f){
      if(["type","model","sn","phone"].indexOf(f.id)>=0)return;
      var hidden=(f.id==="douyin_id"||f.id==="nickname")&&STATE.user.role==="member"&&!isMine;
      if(hidden){
        extraTds+="<td><span style=\"color:var(--faint)\">—</span></td>";
        return;
      }
      var fv=d[f.id];

      if(isQuick&&f.options){

          chips+="<span class=\"chip"+(on?" on":"")+"\" data-v=\""+esc(o)+"\" onclick=\""+fn+"\" style=\"padding:2px 8px;font-size:11px;margin:1px 2px\">"+esc(o)+"</span>";
        });

    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-ghost\" onclick=\"openEditAsset('"+a.id+"',0)\" style=\"margin-right:6px\">编辑</button> <button class=\"btn btn-sm btn-ghost\" onclick=\"showAssetHistory('"+a.id+"')\" style=\"margin-right:6px\">📜 历史</button>";

    if(a.status==="available"){
      h+="<button class=\"btn btn-sm btn-green\" onclick=\"showDirectTake('"+a.id+"')\">直接领用</button> ";

  }else if(a.status==="in_use"){

    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-blue\" onclick=\"toWarehouseAsset('"+a.id+"')\" style=\"margin-right:6px\">转仓库</button>";
    // v13.11：主管/组长也可寄出（与员工我的设备一致）
    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-purple\" onclick=\"showShip('"+a.id+"')\" style=\"margin-right:6px\">寄出</button>";

    h+="<span style=\"color:var(--faint);font-size:12px\">使用中</span>";
  }else if(a.status==="repairing"){
      if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-danger\" onclick=\"directDelAsset('"+a.id+"')\" style=\"margin-right:6px\">删除</button>";

    var shRec=(D.shipments||[]).find(function(x){return x.asset_id===a.id&&x.status==="shipped";});
    h+="<span style=\"color:var(--faint);font-size:12px\">外寄中"+(shRec&&shRec.ship_time?(" · 已寄出 "+shipDays(shRec.ship_time)+" 天"):"")+"</span>";

      h+="<span style=\"color:var(--faint);font-size:12px\">已报废</span>";

  var extraCnt=fieldsData.fields?fieldsData.fields.filter(function(f){return ["type","model","sn","phone"].indexOf(f.id)<0;}).length:0;

// ===== v13.3：台账双击内联编辑（平台/是否有抖音号快捷选择、备注等直接输入）=====
async function inlineEdit(assetId, fieldId, type, td){
  try{
    var fieldsData=await apiGet("/api/fields");
    var f=(fieldsData.fields||[]).find(function(x){return x.id===fieldId;});
    var assetsData=await apiGet("/api/assets");
    var a=assetsData.assets.find(function(x){return x.id===assetId;});
    if(!a){toast("设备不存在","err");return;}
    var cur=(a.data&&a.data[fieldId])||"";
    var html="";
    if(type==="select"&&f&&f.options&&f.options.length){
      var chips="";
      (f.options||[]).forEach(function(o){
        chips+="<span class=\"chip"+(cur===o?" on":"")+"\" data-v=\""+esc(o)+"\" onclick=\"event.stopPropagation();inlineSave('"+assetId+"','"+fieldId+"','"+esc(o)+"')\">"+esc(o)+"</span>";
      });
      html="<div class=\"chip-row\" style=\"white-space:nowrap\">"+chips+"</div>";
    }else{
      html="<input value=\""+esc(cur)+"\" onclick=\"event.stopPropagation()\" style=\"width:140px;box-sizing:border-box;padding:4px 8px;border:1.5px solid var(--line);border-radius:7px;font-size:13px\" onkeydown=\"if(event.key==='Enter')inlineSaveInput('"+assetId+"','"+fieldId+"',this.value)\" onblur=\"inlineBlurSave('"+assetId+"','"+fieldId+"',this)\">";
    }
    td.innerHTML=html;
    var inp=td.querySelector("input");if(inp)inp.focus();
  }catch(e){toast(e.message,"err");}
}

// v13.25：平台多选切换（逗号分隔存储）——员工/主管都可点（员工走 edit_my_asset，可改在库设备）
async function togglePlatform(assetId, plat){
  try{
    // v13.26：改用本地 D.assets（apiGet /api/assets 对员工过滤，仓库里别人登记的在库手机查不到）
    var a=D.assets.find(function(x){return x.id===assetId;});
    if(!a){toast("设备不存在","err");return;}
    var cur=(a.data&&a.data.platform)||"";
    var arr=(cur||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
    // v13.27：点"空"=清空所有平台（空手机）
    if(plat==="空"){arr=[];}
    else{
      var idx=arr.indexOf(plat);
      if(idx>=0)arr.splice(idx,1);else arr.push(plat);
    }
    var val=arr.join(",");
    await doInlineSave(assetId,"platform",val);
  }catch(e){toast(e.message,"err");}
}

// v13.58：设备字段失焦自动保存——点别处即保存（避免输入内容丢失）

  }catch(e){

  }
}

function captureAssetFormState(){
  var box=document.getElementById("assetForm");
  if(!box)return null;
  var st={};
  Array.prototype.forEach.call(box.querySelectorAll("[id^='f_']"),function(el){
    if(el.classList&&el.classList.contains("chip-row")){
      var c=el.querySelector(".chip.on");
      st[el.id]=c?c.getAttribute("data-v"):"";
    }else{ st[el.id]=el.value||""; }
  });
  return st;
}
function restoreAssetFormState(st){
  if(!st)return;
  Object.keys(st).forEach(function(k){
    var el=document.getElementById(k); if(!el)return;
    if(el.classList&&el.classList.contains("chip-row")){
      Array.prototype.forEach.call(el.children,function(c){ c.classList.toggle("on", c.getAttribute("data-v")===st[k]); });
    }else{ el.value=st[k]; }
  });
}

function pickChip(el){
  var row=el.parentNode;
  Array.prototype.forEach.call(row.children,function(c){c.classList.remove("on");});
  el.classList.add("on");
}
function getFieldValue(fid){
  var el=document.getElementById("f_"+fid);
  if(!el)return "";
  if(el.classList&&el.classList.contains("chip-row")){
    var c=el.querySelector(".chip.on");
    return c?c.getAttribute("data-v"):"";
  }
  return el.value.trim();
}

var EDIT_ORIG=null,EDIT_LOCKIDS=[];
async function openEditAsset(id,isMember){
  try{
    var data=await apiGet("/api/fields");
    var permData=await apiGet("/api/settings");
    var allowPhone=permData.settings&&permData.settings.allow_edit_phone;
    // v13.26：改用本地 D.assets（apiGet /api/assets 对员工过滤��仓库在库设备查不到会误报"设备不存在"）
    var a=D.assets.find(function(x){return x.id===id;});
    if(!a){toast("设备不存在","err");return;}
    EDIT_ORIG=a.data||{};
    var lockLabels=["手机型号","手机编号"];
    EDIT_LOCKIDS=[];
    data.fields.forEach(function(f){if(lockLabels.indexOf(f.label)>=0)EDIT_LOCKIDS.push(f.id);});
    var locked=(isMember===1||isMember==="1");
    var h="<h3>编辑设备"+(locked?"（型号/编号修改需审核）":"")+"</h3><div id=\"assetForm\">";
    data.fields.forEach(function(f){
      var cur=(a.data&&a.data[f.id])?a.data[f.id]:"";
      var lock=locked&&EDIT_LOCKIDS.indexOf(f.id)>=0;
      // v13.8：手机号编辑受权限开关控制（开关关→禁用）
      var phoneLock=(f.id==="phone"&&!allowPhone);
      var lockTip=phoneLock?"（需在选项管理开启权限）":(lock?"（修改需审核）":"");
      h+="<div class=\"field\"><label>"+esc(f.label)+(f.required?"<span class=\"req\"> *</span>":"")+(lockTip?"<span style=\"color:var(--orange);font-size:11px\">"+lockTip+"</span>":"")+"</label>";
      if(f.type==="select"){
        h+="<div class=\"chip-row\" id=\"f_"+f.id+"\">";
        f.options.forEach(function(o){h+="<span class=\"chip"+(cur===o?" on":"")+"\" data-v=\""+esc(o)+"\" onclick=\"pickChip(this)\" style=\"opacity:"+(lock||phoneLock?"0.5":"1")+"\">"+esc(o)+"</span>";});
        h+="</div>";
      }else{
        h+="<input id=\"f_"+f.id+"\" placeholder=\""+esc(f.placeholder||"请输入")+"\" value=\""+esc(cur)+"\" "+(lock||phoneLock?"disabled":"")+">";
      }
      h+="</div>";
    });
    h+="</div><div class=\"m-btns\"><button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消</button><button class=\"btn btn-primary\" onclick=\"saveEditAsset('"+id+"','"+(locked?"1":"0")+"')\">保存修改</button></div><div class=\"err\" id=\"a_err\"></div>";
    showModal(h);
  }catch(e){toast(e.message,"err");}
}
async function saveEditAsset(id,isMember){
  var data=await apiGet("/api/fields");
  var locked=isMember==="1";
  var fd={};
  for(var i=0;i<data.fields.length;i++){
    var f=data.fields[i];
    if(locked&&EDIT_LOCKIDS.indexOf(f.id)>=0){fd[f.id]=EDIT_ORIG[f.id]||"";continue;}
    var v=getFieldValue(f.id);
    if(f.required&&!v){document.getElementById("a_err").textContent="请选择「"+f.label+"」";return;}
    fd[f.id]=v;
  }
  try{
    if(locked){
      var editReqs=[];
      var direct={};
      for(var j=0;j<data.fields.length;j++){
        var fj=data.fields[j];
        var vj=getFieldValue(fj.id);
        if(EDIT_LOCKIDS.indexOf(fj.id)>=0){
          if(vj!==(EDIT_ORIG[fj.id]||""))editReqs.push({field:fj.id,label:fj.label,new_value:vj});
        }else{
          direct[fj.id]=vj;
        }
      }
      if(Object.keys(direct).length)await apiPost("/api/actions/edit_my_asset",{asset_id:id,data:direct});
      for(var k=0;k<editReqs.length;k++){
        await apiPost("/api/requests",{type:"edit",asset_id:id,field:editReqs[k].field,new_value:editReqs[k].new_value});
      }
      toast(editReqs.length?"已保存，型号/编号修改已提交审核":"已保存");closeModal();
      renderMyDevList();
    }else{
      await apiPost("/api/actions/edit_asset",{asset_id:id,data:fd});
      toast("已保存");closeModal();
      renderAssetTable();
    }
  }catch(e){document.getElementById("a_err").textContent=e.message;}
}

function shipFilterPass(s){
  if(SHIP_FILTER_REASON&&(s.reason||"")!==SHIP_FILTER_REASON)return false;
  if(SHIP_FILTER_USER&&(s.user_name||"")!==SHIP_FILTER_USER)return false;

  var kw=document.getElementById("shipSearch")?(document.getElementById("shipSearch").value||"").trim():"";
  if(kw){
    var hay=((s.asset_name||"")+" "+(s.asset_model||"")+" "+(s.asset_sn||"")+" "+(s.user_name||"")+" "+(s.to_where||"")+" "+(s.tracking||"")).toLowerCase();

  }
  return true;
}

async function renderSimWhBars(){
  try{
    var data=await apiGet("/api/sims");
    var sims=data.sims||[];
    var stBar=document.getElementById("swStatusBar");
    if(stBar){
      var sCnt={};sims.forEach(function(s){var v=s.data&&s.data.sim_status;sCnt[v]=(sCnt[v]||0)+1;});
      var sDefs=[["","全部"],["在库","在库"],["在用","在用"]];
      var h="<span style=\"font-size:12px;color:var(--faint);line-height:28px\">状态：</span>";
      sDefs.forEach(function(d){
        var n=d[0]===""?sims.length:(sCnt[d[0]]||0);
        h+="<span class=\"chip"+(SIM_WH_STATUS===d[0]?" on":"")+"\" data-v=\""+d[0]+"\" onclick=\"swFilterStatus(this)\">"+d[1]+" ("+n+")</span>";
      });
      stBar.innerHTML=h;
    }
    var tBar=document.getElementById("swTypeBar");
    if(tBar){
      var tCnt={};sims.forEach(function(s){var v=(s.data&&s.data.sim_type)||"其他";tCnt[v]=(tCnt[v]||0)+1;});
      var types=["移动","电信","联通","其他"];
      var h2="<span style=\"font-size:12px;color:var(--faint);line-height:28px\">运营商：</span>";
      h2+="<span class=\"chip"+(SIM_WH_TYPE===""?" on":"")+"\" data-v=\"\" onclick=\"swFilterType(this)\">全部 ("+sims.length+")</span>";
      types.forEach(function(o){
        var n=tCnt[o]||0;
        h2+="<span class=\"chip"+(SIM_WH_TYPE===o?" on":"")+"\" data-v=\""+o+"\" onclick=\"swFilterType(this)\">"+o+" ("+n+")</span>";
      });
      tBar.innerHTML=h2;
    }
  }catch(e){}
}

async function renderSimWhTable(){
  var data=await apiGet("/api/sims");
  var role=STATE.user.role;
  var isMgr=(role==="supervisor"||role==="leader");
  // v13.38：员工可编辑所有卡开关
  var allowAll=!!(D.settings&&D.settings.allow_edit_all_sim);
  var kw=document.getElementById("swSearch")?(document.getElementById("swSearch").value||"").trim():"";
  // v13.9：状态/运营商快捷筛选（SIM_WH_STATUS 默认在库）
  var h="";
  (data.sims||[]).forEach(function(s){
    var d=s.data||{};
    if(SIM_WH_STATUS&&d.sim_status!==SIM_WH_STATUS)return;
    if(SIM_WH_TYPE&&d.sim_type!==SIM_WH_TYPE)return;
    // v13.35：盒号筛选（所有页面统一）

    if(kw&&((d.sim_no||"")+" "+(d.sim_type||"")).indexOf(kw)<0)return;

    var bindInfo=s.asset_id?("📱 "+esc(s.asset_name)+(s.asset_phone?(" · "+esc(s.asset_phone)):(s.asset_sn?(" · 编号"+esc(s.asset_sn)):""))):"<span style=\"color:var(--faint)\">未绑定</span>";
    // v13.10：行内"领用"按钮（在库卡，提交申请→主管审核）
    var swTake=(d.sim_status==="在库"&&!s.user_id);
    h+="<tr><td><input type=\"checkbox\" class=\"sw-chk\" value=\""+s.id+"\" onchange=\"swUpdateSel()\"></td><td><b>"+esc(d.sim_no||"—")+"</b></td><td>"+esc(d.sim_type||"—")+"</td><td>"+bindInfo+returnTag(d)+"</td><td>"+(s.user_id?(esc(s.user_name||"—")+" <span class=\"tag tag-blue\" style=\"font-size:11px;padding:2px 8px\">在用</span>"):esc(inStockOwner(s.created_by)||s.created_by_name||"—"))+"</td><td class=\"num\">"+esc(s.created)+"</td><td>"+(swTake?"<button class=\"btn btn-sm btn-green\" onclick=\"swTakeOne('"+s.id+"')\">领用</button>":"<span style=\"color:var(--faint);font-size:12px\">—</span>")+"</td>"+(isMgr||allowAll?"<td style=\"white-space:nowrap\"><button class=\"btn btn-sm btn-ghost\" onclick=\"showEditSim('"+s.id+"')\">编辑</button> "+(isMgr?"<button class=\"btn btn-sm btn-danger\" onclick=\"delSimF('"+s.id+"')\">删除</button>":"")+"</td>":"")+"</tr>";
  });
  if(!h)h="<tr><td colspan=\""+(isMgr?8:7)+"\" class=\"empty\">暂无在库电话卡</td></tr>";
  document.getElementById("swBody").innerHTML=h;
  swUpdateSel();
}
function swToggleAll(el){
  var checked=el.checked;
  Array.prototype.forEach.call(document.querySelectorAll(".sw-chk"),function(c){c.checked=checked;});
  swUpdateSel();
}
function swUpdateSel(){
  var n=document.querySelectorAll(".sw-chk:checked").length;
  var btn=document.getElementById("swTakeBtn");
  if(btn)btn.textContent="📥 申请领用所选 ("+n+")";
  var abtn=document.getElementById("swAssignBtn");
  if(abtn)abtn.textContent="📤 分配给所选员工 ("+n+")";
  var info=document.getElementById("swSelInfo");
  if(info)info.textContent=n?"已选 "+n+" 张":"";

async function simWhTake(){
  var ids=Array.prototype.map.call(document.querySelectorAll(".sw-chk:checked"),function(c){return c.value;});
  if(!ids.length){toast("请先勾选要领用的电话卡","err");return;}
  try{
    var r=await apiPost("/api/sims/batch_take",{sim_ids:ids});
    toast("✅ 已提交 "+r.submitted+" 张领用申请"+(r.failed?"（"+r.failed+" 张不可领用）":"")+"，等待审核");
    renderSimWhTable();refreshBadges();
  }catch(e){toast(e.message,"err");}
}
async function simWhAssign(){
  var ids=Array.prototype.map.call(document.querySelectorAll(".sw-chk:checked"),function(c){return c.value;});
  var uid=document.getElementById("swAssignUser")?document.getElementById("swAssignUser").value:"";
  if(!ids.length){toast("请先勾选要分配的电话卡","err");return;}
  if(!uid){toast("请选择接收的员工","err");return;}
  var ok=0,fail=0;
  try{
    for(var i=0;i<ids.length;i++){
      try{await apiPost("/api/sims/assign",{sim_id:ids[i],user_id:uid});ok++;}
      catch(e){fail++;}
    }
    toast("✅ 已分配 "+ok+" 张"+(fail?"（"+fail+" 张失败）":""));
    renderSimWhTable();
  }catch(e){toast(e.message,"err");}
}

// v13.34：一键打印盒贴（每盒卡号清单，剪贴到盒子上）
function printBoxLabel(){
  var boxes={};
  (D.simcards||[]).forEach(function(s){
    var d=s.data||{};
    var b=(d.box_no||"").trim();if(!b)return;
    if(!boxes[b])boxes[b]=[];
    boxes[b].push({no:d.sim_no||"",slot:d.box_slot||""});
  });
  var nos=Object.keys(boxes).map(Number).filter(function(x){return !isNaN(x);}).sort(function(a,b){return a-b;});
  var w=window.open("","_blank");
  if(!w){toast("请允许弹出窗口","err");return;}
  var h="<html><head><meta charset=\"utf-8\"><title>盒贴打印</title><style>body{font-family:sans-serif;padding:20px}table{width:100%;border-collapse:collapse;margin-bottom:30px}th,td{border:1px solid #999;padding:6px 10px;font-size:13px;text-align:left}th{background:#f0f0f0}.boxhead{font-size:20px;font-weight:bold;margin:6px 0 8px}</style></head><body>";
  nos.forEach(function(b){
    h+="<div class=\"boxhead\">"+b+" 号盒（"+boxes[b].length+" 张）</div><table><tr><th>编号</th><th>卡号</th><th>运营商</th></tr>";
    for(var i=1;i<=10;i++){
      var c=boxes[b].find(function(x){return x.slot===String(i);});
      if(c){
        var sim=(D.simcards||[]).find(function(x){return x.data&&x.data.sim_no===c.no;});
        h+="<tr><td>"+i+"</td><td>"+c.no+"</td><td>"+(sim&&sim.data?esc(sim.data.sim_type||""):"")+"</td></tr>";
      }else{
        h+="<tr><td>"+i+"</td><td colspan=\"2\" style=\"color:#aaa\">空</td></tr>";
      }
    }
    h+="</table>";
  });
  h+="<script>window.onload=function(){window.print();}</scr"+"ipt></body></html>";
  w.document.write(h);
  w.document.close();
}

// v13.51：标签打印核心（50mm×30mm 热敏标签纸，DP23）——'single'单张 / 'batch'多张连续（每张一页，连续出纸）
function printLabels(items,mode){
  if(!items||!items.length){toast("没有可打印的标签","err");return;}
  var isBatch=mode==="batch";
  var css="@page{size:50mm 30mm;margin:0}body{font-family:'Microsoft YaHei','SimHei',sans-serif;margin:0}.label{width:50mm;height:30mm;box-sizing:border-box;border:0.5pt solid #444;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1mm 2mm;overflow:hidden}"+(isBatch?".label{page-break-after:always}.label:last-child{page-break-after:auto}":"");
  css+=".ph{font-size:14px;font-weight:bold;letter-spacing:0.5px;white-space:nowrap}.op{font-size:12px;margin-top:2px;white-space:nowrap;color:#333}.no{font-size:14px;font-weight:bold;margin-top:2px;white-space:nowrap}";
  // v13.51：打印设置引导条（仅屏幕显示，打印时隐藏）
  css+=".hint{position:fixed;top:0;left:0;right:0;background:#fff8e1;color:#7a5b00;border-bottom:2px solid #ffc107;padding:10px 14px;font-size:14px;font-weight:bold;z-index:999}@media print{.hint{display:none}}body{padding-top:0}";
  function cell(it){
    var noStr=it.no||"—";
    if(SIM_MASK){
      var digits=String(noStr).replace(/\D/g,"");
      if(digits.length>=7)noStr=digits.slice(0,3)+"****"+digits.slice(-4);
    }
    return "<div class=\"label\"><div class=\"ph\">手机号："+esc(noStr)+"</div><div class=\"op\">运营商："+esc(it.op||"—")+"</div><div class=\"no\">编号："+esc(it.slot||"—")+"</div></div>";
  }
  var h="<html><head><meta charset=\"utf-8\"><title>电话卡标签打印</title><style>"+css+"</style></head><body>";
  h+="<div class=\"hint\">🖨 打印设置：打印机选「DP23 Label Printer」 · 纸张选「50×30 / 50x30mm」 · 方向「横向」 · 边距「无」 · 缩放「100%」</div>";
  var arr=isBatch?items:[items[0]];
  arr.forEach(function(it){h+=cell(it);});
  h+="<script>window.onload=function(){window.print();}</scr"+"ipt></body></html>";
  var w=window.open("","_blank");
  if(!w){toast("请允许弹出窗口","err");return;}
  w.document.write(h);
  w.document.close();
}

// 选中卡是否都在同一盒（用于智能判断是否连续打印）
function simBoxOf(id){
  var s=(D.simcards||[]).find(function(x){return x.id===id;});
  return s&&s.data?(s.data.box_no||""):"";
}
// 打印选中标签：同盒的按编号排序，便于连续贴入收纳册
function printSimSelected(){
  var ids=Object.keys(SIM_SELECTED);
  if(!ids.length){toast("请先勾选电话卡","err");return;}
  ids.sort(function(a,b){
    var ba=simBoxOf(a),bb=simBoxOf(b);
    if(ba!==bb)return (parseInt(ba,10)||999)-(parseInt(bb,10)||999);
    var sa=(D.simcards||[]).find(function(x){return x.id===a;});
    var sb=(D.simcards||[]).find(function(x){return x.id===b;});
    var na=parseInt((sa&&sa.data&&sa.data.box_slot)||"999",10)||999;
    var nb=parseInt((sb&&sb.data&&sb.data.box_slot)||"999",10)||999;
    return na-nb;

// 执行打印（按范围取卡 + 同盒排序）
function doPrint(){
  var ids=[];
  if(PRINT_SCOPE==="selected")ids=Object.keys(SIM_SELECTED);
  else if(PRINT_SCOPE==="filter")ids=(window.__simListIds||[]).slice();
  else ids=(D.simcards||[]).map(function(s){return s.id;});
  if(!ids.length){document.getElementById("pErr").textContent="该范围没有可打印的卡";return;}
  // 同盒的按编号排序
  ids.sort(function(a,b){
    var ba=simBoxOf(a),bb=simBoxOf(b);
    if(ba!==bb)return (parseInt(ba,10)||999)-(parseInt(bb,10)||999);
    var sa=(D.simcards||[]).find(function(x){return x.id===a;});
    var sb=(D.simcards||[]).find(function(x){return x.id===b;});
    var na=parseInt((sa&&sa.data&&sa.data.box_slot)||"999",10)||999;
    var nb=parseInt((sb&&sb.data&&sb.data.box_slot)||"999",10)||999;
    return na-nb;
  });
  closeModal();
  printSimLabels(ids,"batch");
}
// v13.51：电话卡标签打印（按卡 id，'single'单张 / 'batch'当前列表连续出纸）
function printSimLabels(ids,mode){
  var items=[];
  (ids||[]).forEach(function(id){
    var s=(D.simcards||[]).find(function(x){return x.id===id;});
    if(!s||!s.data)return;
    items.push({no:s.data.sim_no||"",slot:s.data.box_slot||"",op:s.data.sim_type||detectOperator(s.data.sim_no||"")});
  });
  if(!items.length){toast("没有可打印的电话卡","err");return;}
  printLabels(items,mode);
}

// v13.33：电话卡签到 helper——判断卡是否需要签到（在用卡 + 超过间隔天数）
function simNeedCheckin(s){
  try{
    var st=D.settings||{};
    if(!st.checkin_enabled)return false;
    var d=s.data||{};
    if(d.sim_status!=="在用")return false;
    if(!s.last_checkin)return true;
    var freq=(parseInt(st.checkin_freq_days,10)||3)*86400000;
    var last=new Date(String(s.last_checkin).replace(/-/g,"/")).getTime();
    if(isNaN(last))return true;

  }catch(e){return false;}
}

// v13.50：运营商按卡号自动识别（移动/联通/电信），无需手动选择
function detectOperator(num){
  var s=(num||"").replace(/\D/g,"");
  if(!s)return "";
  // ICCID：8986 + MNC(2位) 识别运营商
  if(s.length>=6&&s.indexOf("8986")===0){
    var mnc=s.substr(4,2);
    if(mnc==="00"||mnc==="02"||mnc==="04")return "移动";
    if(mnc==="01"||mnc==="06"||mnc==="09")return "联通";
    if(mnc==="03"||mnc==="11")return "电信";
  }
  // 11位手机号：按号段识别运营商
  if(s.length===11&&s.charAt(0)==="1"){
    var p3=s.substr(0,3);
    var YD=["134","135","136","137","138","139","147","148","150","151","152","157","158","159","172","178","182","183","184","187","188","195","197","198","165","167"];
    var LT=["130","131","132","145","146","155","156","166","171","175","176","185","186","196"];
    var DX=["133","149","153","173","174","177","180","181","189","190","191","193","199","162"];
    if(YD.indexOf(p3)>=0)return "移动";
    if(LT.indexOf(p3)>=0)return "联通";
    if(DX.indexOf(p3)>=0)return "电信";
  }
  return "其他";
}

// v13.34/v13.36：自动分配盒号（10张一盒）——编号(手机背面编号)由手工填写
function autoBoxSlot(){
  var slots={};
  (D.simcards||[]).forEach(function(s){
    var d=s.data||{};
    if(!d.box_no)return;
    slots[d.box_no]=(slots[d.box_no]||0)+1;
  });
  // 找第一个未满的盒（<10），否则开新盒
  var nos=Object.keys(slots).map(Number).filter(function(x){return !isNaN(x);}).sort(function(a,b){return a-b;});
  var box=1;
  if(nos.length){
    var found=nos.find(function(n){return slots[n]<10;});
    box=found!==undefined?found:(Math.max.apply(null,nos)+1);
  }
  return {box_no:String(box),box_slot:""};
}

// ===== v13.61：手机端极简拍照（一键快门 · 自动识别 · 简单核对）=====
// 打开全屏相机（手机端主入口）：进入即全屏取景，只有「拍」和「相册」两个按钮
function openSnapAsset(assetId){SNAP_TARGET="asset";SCAN_FOR_ASSET=assetId||"";openSnap("serial");}
function openSnap(mode){
  SCAN_MODE=mode||"sim";
  if(!document.getElementById("snapWrap")){
    var d=document.createElement("div");
    d.id="snapWrap";
    d.innerHTML='<video id="snapVideo" autoplay playsinline muted></video>'
      +'<div class="snap-top"><span id="snapTitle">📇 拍照录入电话卡</span><button class="snap-close" onclick="closeSnap()">✕</button></div>'
      +'<div class="snap-tip" id="snapTip">把电话卡对准框内，点白色按钮拍照</div>'
      +'<div class="snap-bottom">'
      +'<div class="snap-side" onclick="snapPick()" title="从相册选">🖼</div>'
      +'<div class="snap-btn" onclick="snapShot()">拍</div>'
      +'<div class="snap-side" onclick="snapToggleCam()" title="切换前后摄像头">🔄</div>'
      +'</div>'
      +'<input type="file" id="snapFile" accept="image/*" capture="environment" style="display:none" onchange="snapOnPick(this)">';
    document.body.appendChild(d);
  }
  document.getElementById("snapWrap").className="on";
  var m=SCAN_MODES[SCAN_MODE]||SCAN_MODES.sim;
  document.getElementById("snapTitle").textContent=m.icon+" 拍照录入 · "+m.label;
  document.getElementById("snapTip").textContent=m.hint;
  snapFacing="environment";
  startSnapCam();
}
var SNAP_STREAM=null,SNAP_FACING="environment",SNAP_FACING_VAR="environment";
function startSnapCam(){
  var v=document.getElementById("snapVideo");if(!v)return;
  stopSnapCam();

    .then(function(st){SNAP_STREAM=st;v.srcObject=st;})

// 交给识别引擎，显示进度
function snapProcess(dataUrl){
  stopSnapCam();
  showSnapProgress("正在压缩图片…",0);
  var img=new Image();
  img.onload=function(){
    try{
      var max=1600,sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var out=c.toDataURL("image/jpeg",0.88);
      showSnapProgress("正在识别…",30);
      runSnapOcr(out);
    }catch(e){showSnapProgress("图片处理失败："+e.message,100);}
  };
  img.onerror=function(){showSnapProgress("图片读取失败，请重拍",100);};
  img.src=dataUrl;
}
function showSnapProgress(msg,pct){
  var w=document.getElementById("snapWrap");if(!w)return;
  var el=w.querySelector(".snap-prog");
  if(!el){
    el=document.createElement("div");el.className="snap-prog";
    el.innerHTML='<div id="snapProgMsg"></div><div class="snap-bar"><i id="snapProgBar"></i></div>';
    w.appendChild(el);
  }
  document.getElementById("snapProgMsg").textContent=msg;
  document.getElementById("snapProgBar").style.width=Math.min(100,pct)+"%";
}
function hideSnapProgress(){
  var w=document.getElementById("snapWrap");if(!w)return;
  var el=w.querySelector(".snap-prog");if(el)el.remove();
}
// 执行识别（分片并行）
function runSnapOcr(dataUrl){
  var t0=Date.now();
  var m=SCAN_MODES[SCAN_MODE]||SCAN_MODES.sim;
  function finish(txt,secs){
    closeSnap();
    if(SCAN_MODE==="sim"){
      var nums=String(txt||"").match(/1[3-9]\d{9}/g)||[];
      var uniq={},cards=[];
      nums.forEach(function(n){if(!uniq[n]){uniq[n]=1;cards.push({num:n,from:"识别"});}});
      openSimCheckin(cards,secs);
      return;
    }
    if(SCAN_MODE==="serial")return openSnapPick(parseSerialCandidates(txt),dataUrl,secs);
    if(SCAN_MODE==="douyin")return showOcrResult(parseOcrJson(txt));
    showAssetOcrResult(parseAssetJson(txt));
  }
  // 电话卡批量（一图多卡小幅字）仍需分片；其余场景整图竞速最快最准
  if(SCAN_MODE==="sim"){
    return sliceImage(dataUrl,2,2,60).then(function(pieces){
      return agnesVisionParallel(pieces,m.prompt,function(done,total){
        showSnapProgress("识别中 "+done+"/"+total+" 片…",30+Math.round(done/total*60));
      });
    }).then(function(results){
      var cards=mergeCardResults(results);
      closeSnap();openSimCheckin(cards,((Date.now()-t0)/1000).toFixed(1));
    }).catch(function(){
      return agnesVisionRace(dataUrl,m.prompt,4).then(function(w){finish(w.txt,((Date.now()-t0)/1000).toFixed(1));});
    });
  }
  showSnapProgress("⚡ 极速识别中…",50);
  var tick=setInterval(function(){
    var el=document.getElementById("snapProgMsg");
    if(el)el.textContent="⚡ 极速识别中… "+(((Date.now()-t0)/1000).toFixed(1))+"s";
  },200);
  return agnesVisionRace(dataUrl,m.prompt,4).then(function(w){
    clearInterval(tick);
    showSnapProgress("识别完成","100");
    var secs=(w.ms/1000).toFixed(1)+(w.tried>1?" · "+w.tried+"路竞速":" · 单路");
    finish(w.txt,secs);
  }).catch(function(err){
    clearInterval(tick);
    showSnapProgress("识别失败："+err.message,"100");
    setTimeout(closeSnap,1500);
  });
}

// ===== v13.63：手机序号候选选择（识别一堆文字 → 人点选一个 → 确认保存）=====
var SNAP_CANDIDATES=[], SNAP_PICK_IDX=-1, SNAP_FOR_ASSET="";
// 从识别文本里抽出所有"像编号"的候选
function parseSerialCandidates(txt){
  var raw=String(txt||"");
  var out=[], seen={};
  function push(v,tag){
    v=String(v||"").trim().replace(/^["'"""'']+|["'"""'']+$/g,"").trim();
    if(!v)return;
    // v13.66：三字中文标签直接保留（微亿来/财务部等），豁免长度与字母数字要求
    if(/^[\u4e00-\u9fa5]+$/.test(v)){
      if(v.length===3&&!seen["标签:"+v]){seen["标签:"+v]=1;out.push({v:v,tag:"标签",score:90});}
      return;
    }
    if(v.length<5||v.length>28)return;
    if(!/[0-9A-Za-z]/.test(v))return;              // 必须含字母数字
    // v13.63：纯字母英文单词丢掉（真实SN必含数字；避免 Designed/Assembled/California 混进候选）
    if(/^[A-Za-z]+$/.test(v))return;
    if(/^[A-Za-z\s]+$/.test(v))return;
    // 常见英文短语黑名单
    if(/^(designed|assembled|in china|california|apple|model|iphone|samsung|huawei|xiaomi|oppo|vivo|made|by|the)\b/i.test(v))return;
    if(/^(IMEI|MEID|SN|S\/N|序号|序列号|串号|型号|MODEL)$/i.test(v))return;
    var k=v.toUpperCase();
    if(seen[k])return;
    seen[k]=1;
    out.push({v:v,tag:tag||""});
  }
  // A. 逐行拆（AI 按要求每行一个）
  raw.split(/[\r\n]+/).forEach(function(line){
    var L=String(line||"").trim();
    if(!L)return;
    // 去掉前面的标签：IMEI / IMEI1 / S/N / SN / 序列号：等
    var stripped=L.replace(/^\s*(?:[-*•]\s*|\d{1,2}[.、)）]\s*)/,"")
                  .replace(/^\s*(?:IMEI\s*\d?|MEID|S\s*\/\s*N|SN|序号|序列号|串号|型号|MODEL)\s*[:：=]?\s*/i,"")
                  .trim();
    push(stripped,"");
    // 行里可能还有别的编号（"S/N: ABC123 IMEI: 123..."），正则兜底再抽
    var m;
    var re=/[A-Za-z0-9][A-Za-z0-9\-\/]{5,25}/g;
    while((m=re.exec(L))!==null){ push(m[0],""); }
  });
  // B. 全文拉 IMEI（15位纯数字）
  var im=raw.match(/\b\d{15}\b/g)||[];
  im.forEach(function(x){ push(x,"IMEI"); });
  // 打分排序：含字母的SN 优先（手机背面序号最常用）> IMEI 15位纯数字 > 其余
  out.forEach(function(o){
    var v=o.v;
    if(/^[A-Za-z0-9]{8,20}$/.test(v)&&/[A-Za-z]/.test(v)&&/\d/.test(v)){o.tag="SN?";o.score=100;}
    else if(/^\d{15}$/.test(v)){o.tag="IMEI";o.score=85;}
    else if(/^[A-Za-z0-9\-]{8,20}$/.test(v)){o.tag="";o.score=60;}
    else {o.score=30;}
  });
  out.sort(function(a,b){return b.score-a.score;});
  return out;
}

function openSimCheckin(cards,secs){

    showModal("<h3>😕 没识别到卡号</h3>"
      +"<div style=\"padding:10px 0;font-size:15px;line-height:1.7\">可能原因：<br>· 卡面反光或模糊<br>· 号码被遮挡<br>· 拍太远了</div>"
      +"<div style=\"font-size:13px;color:var(--faint)\">建议：把卡平放、光线均匀、离近一点重拍（占满画面 1/2 以上）</div>"
      +"<div class=\"m-btns\"><button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消</button><button class=\"btn btn-primary\" onclick=\"closeModal();openSnap('sim')\">🔄 重新拍</button></div>");
    return;
  }
  var exist={};
  (D.simcards||[]).forEach(function(s){if(s.data&&s.data.sim_no)exist[s.data.sim_no]=1;});
  var dupN=cards.filter(function(c){return exist[c.num];}).length;
  var newCards=cards.filter(function(c){return !exist[c.num];});
  window.__snapCards=cards.map(function(c){return {num:c.num,dup:!!exist[c.num],from:c.from};});
  var rows=newCards.map(function(c){
    return "<tr><td style=\"width:26px\"><input type=\"checkbox\" class=\"simck\" data-no=\""+c.num+"\" checked style=\"width:20px;height:20px\"></td>"
      +"<td style=\"font-size:15px;font-weight:600;padding:10px 4px\">"+esc(c.num)+"</td>"

    +"</div>"

async function importSnapCards(){

function compressImage(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    try{
      var max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*scale));
      c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.85));
    }catch(e){setScanErr("图片处理失败："+e.message);}
  };
  img.onerror=function(){setScanErr("图片读取失败，请重试");};

// v13.61：多key轮询取一个可用 key（跳过失效黑名单，循环196个）
function agnesNextKey(){
  for(var i=0;i<AGNES_KEYS.length;i++){
    var k=AGNES_KEYS[(AGNES_IDX+i)%AGNES_KEYS.length];
    if(!AGNES_BAD[k]){AGNES_IDX=(AGNES_IDX+i+1)%AGNES_KEYS.length;return k;}
  }
  AGNES_BAD={};
  return AGNES_KEYS[AGNES_IDX++ % AGNES_KEYS.length];
}
// 单次视觉识别（可指定key；429/401/失效 → 自动换key重试，最多6个key）
function agnesVision(dataUrl,prompt,keyPool){
  var attempt=0,maxTry=6;
  function tryOne(){
    if(attempt>=maxTry)return Promise.reject(new Error("已尝试"+maxTry+"个key均失败"));
    var k=(keyPool&&keyPool.length)?keyPool[attempt%keyPool.length]:agnesNextKey();
    attempt++;
    return fetch(AGNES_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},
      body:JSON.stringify({model:AGNES_MODEL,messages:[{role:"user",content:[
        {type:"image_url",image_url:{url:dataUrl}},
        {type:"text",text:prompt}
      ]}],max_tokens:2000})
    }).then(function(r){
      if(r.status===429||r.status===401||r.status===403){AGNES_BAD[k]=1;throw new Error("key限流/失效，自动换key");}
      return r.json();
    }).then(function(j){
      if(j.error){AGNES_BAD[k]=1;throw new Error(String(j.error.message||"接口错误").slice(0,80));}
      if(j.choices&&j.choices[0]&&j.choices[0].message)return String(j.choices[0].message.content||"");
      throw new Error("返回格式异常");
    }).catch(function(err){
      if(attempt<maxTry)return tryOne();
      throw err;
    });
  }
  return tryOne();
}
// v13.66：极速竞速识别 —— 同一张图用 N 个不同 key 同时发，谁先回用谁
// 原理：Agnes 免费池是抽奖式的，有的请求 1 秒回、有的排 40 秒；并发抢最快那条
function agnesVisionRace(dataUrl,prompt,n,onTick){
  n=Math.max(1,Math.min(n||4,AGNES_KEYS.length));
  var t0=Date.now(),settled=0,failed=0;
  var keys=[];for(var i=0;i<n;i++)keys.push(agnesNextKey());
  var tasks=keys.map(function(k){
    return fetch(AGNES_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},
      body:JSON.stringify({model:AGNES_MODEL,messages:[{role:"user",content:[
        {type:"image_url",image_url:{url:dataUrl}},
        {type:"text",text:prompt}
      ]}],max_tokens:300})
    }).then(function(r){
      if(r.status===429||r.status===401||r.status===403){AGNES_BAD[k]=1;throw new Error("限流");}
      return r.json();
    }).then(function(j){
      if(j.error){AGNES_BAD[k]=1;throw new Error(String(j.error.message||"").slice(0,60));}
      var txt=String(j.choices&&j.choices[0]&&j.choices[0].message?j.choices[0].message.content:"");
      if(!txt.trim())throw new Error("空返回");
      return {txt:txt,ms:Date.now()-t0};
    }).catch(function(e){
      failed++;settled++;
      if(onTick)onTick(settled,n);
      throw e;
    });
  });
  return Promise.any(tasks).then(function(w){
    w.tried=n;
    return w;
  }).catch(function(){
    // 全部失败 → 降级串行重试
    return agnesVision(dataUrl,prompt).then(function(txt){
      return {txt:txt,ms:Date.now()-t0,tried:n,fallback:true};
    });
  });
}

// v13.61：调 Agnes 识别，按场景分流（抖音账号 / 电话卡批量 / 设备信息）
function ocrImage(dataUrl){
  var t0=Date.now();
  if(SCAN_MODE==="sim")return ocrSimCards(dataUrl,t0);
  var m=SCAN_MODES[SCAN_MODE]||SCAN_MODES.douyin;
  setScanErr("⏳ 识别中（Agnes · key池 "+AGNES_KEYS.length+" 个）…");
  agnesVision(dataUrl,m.prompt).then(function(content){
    if(!content){setScanErr("识别失败：无返回，可手动填写");return;}
    console.log("[Agnes识图] "+SCAN_MODE+" 耗时 "+((Date.now()-t0)/1000).toFixed(1)+"s");
    if(SCAN_MODE==="asset")return showAssetOcrResult(parseAssetJson(content));
    showOcrResult(parseOcrJson(content));
  }).catch(function(err){
    setScanErr("识别失败："+err.message+"，可手动填写");
  });
}
// 电话卡批量识别：切成 2x2 分片并行识别（196 key池 → 速度提升数倍）
function ocrSimCards(dataUrl,t0){
  setScanErr("⏳ 正在分片并行识别（4片同时跑 · 每片独立key）…");
  sliceImage(dataUrl,2,2,60).then(function(pieces){
    if(!pieces.length)throw new Error("切图失败");
    return agnesVisionParallel(pieces,SCAN_MODES.sim.prompt,function(done,total,label){
      setScanErr("⏳ 并行识别中 "+done+"/"+total+" 片完成…");
    });
  }).then(function(results){
    var cards=mergeCardResults(results);
    console.log("[Agnes批量] "+cards.length+" 张卡，耗时 "+((Date.now()-t0)/1000).toFixed(1)+"s");
    showSimOcrResult(cards,results,t0);
  }).catch(function(err){
    // 降级：分片失败 → 整图单次识别
    setScanErr("分片失败("+err.message+")，改用整图识别…");
    agnesVision(dataUrl,SCAN_MODES.sim.prompt).then(function(txt){
      var nums=String(txt||"").match(/1[3-9]\d{9}/g)||[];
      var uniq={},cards=[];
      nums.forEach(function(n){if(!uniq[n]){uniq[n]=1;cards.push({num:n,from:"整图"});}});
      showSimOcrResult(cards,[],t0);
    }).catch(function(e2){setScanErr("识别失败："+e2.message);});
  });
}
