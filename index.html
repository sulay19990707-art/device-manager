<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备管理系统</title>
<style>
:root{
  --bg:#eef1f5;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--faint:#9aa0a6;
  --line:#e5e8ef;--blue:#0a84ff;--blue-bg:#e8f1ff;--green:#34c759;--green-bg:#e8f8ee;
  --orange:#ff9500;--orange-bg:#fff4e5;--red:#ff3b30;--red-bg:#ffeceb;
  --purple:#7c5cff;--purple-bg:#f0ecff;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 6px 24px rgba(0,0,0,.06);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

/* 登录 */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f5f7fb 0%,#e6ecf4 100%)}
.login-card{width:380px;max-width:92vw;background:#fff;border-radius:16px;padding:38px 34px 30px;box-shadow:0 20px 60px rgba(30,60,100,.14);text-align:center}
.login-card h1{font-size:22px;font-weight:700;color:#111;margin-bottom:6px}
.login-card .sub{color:var(--sub);font-size:13px;margin-bottom:26px}
.login-card input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:15px;margin-bottom:12px;background:#fafbfc;outline:none;transition:.2s;color:var(--ink)}
.login-card input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(10,132,255,.12)}
.login-card button{width:100%;height:46px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.login-card button:hover{background:#0071e3}
.login-card button:disabled{opacity:.55;cursor:not-allowed}
.login-err{margin-top:12px;min-height:18px;font-size:13px;color:var(--red)}

/* 布局 */
#app{display:none;height:100vh}
.layout{display:flex;height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:20px 20px 14px;font-size:16px;font-weight:700;color:#111;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sb-logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex-shrink:0}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--sub);font-size:14px;transition:.15s;margin-bottom:2px;position:relative}
.nav-item:hover{background:#f4f6fa;color:var(--ink)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:600}
.nav-badge{background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
.sb-user{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.sb-user .u-info{flex:1;min-width:0}
.sb-user .u-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .u-role{font-size:12px;color:var(--faint)}
.sb-user .logout{cursor:pointer;color:var(--faint);font-size:13px;padding:4px 6px;border-radius:6px}
.sb-user .logout:hover{color:var(--red);background:var(--red-bg)}
.main{flex:1;overflow-y:auto;padding:24px 28px;min-width:0}
.page-title{font-size:22px;font-weight:700;color:#111;margin-bottom:2px}
.page-desc{font-size:13px;color:var(--sub);margin-bottom:18px}

/* 组件 */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.kpi .label .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kpi .val{font-size:26px;font-weight:700;color:var(--ink)}
.kpi .sub{font-size:12px;color:var(--faint);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.card .c-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.card .c-head h3{font-size:15px;font-weight:600;color:var(--ink)}
.card .c-body{padding:16px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:#f7f9fc;color:var(--sub);font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfd}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-orange{background:var(--orange-bg);color:var(--orange)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}
.tag-gray{background:#f1f3f6;color:#6b7280}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#0071e3}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:#0a84ff;color:#fff}
.btn-green:hover{background:#2fb64f}
.btn-danger{background:#fff;color:var(--red);border:1px solid #ffd7d5}
.btn-danger:hover{background:var(--red-bg)}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{background:#e08a00}
.btn-ghost{background:#f1f3f6;color:var(--sub)}
.btn-ghost:hover{background:#e7eaf0;color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:12px}
.mb{margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px}
.empty{text-align:center;padding:36px 0;color:var(--faint)}
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-bar select,.link-btn{background:none;border:none;color:var(--accent,#0a84ff);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.filter-bar input{height:38px;border:1.5px solid var(--line);border-radius:9px;padding:0 12px;font-size:13px;background:#fff;color:var(--ink);outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--blue)}
.link-btn{background:none;border:none;color:var(--accent,#0a84ff);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.filter-bar input{width:200px}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:460px;max-width:94vw;max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.modal h3{font-size:17px;font-weight:700;color:#111;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:500}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;height:42px;border:1.5px solid var(--line);border-radius:9px;padding:0 12px;font-size:14px;background:#fafbfc;outline:none;color:var(--ink);font-family:inherit}
.field textarea{height:80px;padding:10px 12px;resize:vertical}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(10,132,255,.1)}
.m-btns{display:flex;gap:10px;margin-top:20px}
.m-btns button{flex:1;height:44px}
.err{min-height:18px;font-size:13px;color:var(--red);margin-top:10px}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:300;background:#111;color:#fff;padding:11px 22px;border-radius:99px;font-size:13px;transition:.35s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#d23c32}
.toast.ok{background:#1e9e4c}

.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 18px;border-radius:99px;border:1.5px solid var(--line);background:#fafbfc;font-size:13px;cursor:pointer;transition:.15s;color:var(--ink);user-select:none}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
/* 申请卡 */
.req-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff}
.req-item .r-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.req-item .r-type{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.req-item .r-desc{font-size:13px;color:var(--sub);margin-bottom:8px}
.req-item .r-actions{display:flex;gap:8px;flex-wrap:wrap}
.req-note{font-size:12px;color:var(--faint);margin-top:6px}

/* 响应式 */
@media(max-width:900px){
  .sidebar{width:60px}
  .sb-logo span,.nav-item span:not(.nav-badge){display:none}
  .nav-item{justify-content:center;padding:12px 0}
  .sb-user .u-info,.sb-user .logout{display:none}
  .main{padding:12px}
  /* v13.5：手机表格横向滚动看全列（表格保持内容宽度，容器内滑动） */
  .card table{min-width:max-content;width:100%}
  .card table th,.card table td{white-space:nowrap;padding:7px 9px}
  table{font-size:12px}
  .kpi-row{flex-wrap:wrap}
  .m-btns{flex-wrap:wrap}
  .filter-bar input{width:100%;max-width:240px}
  .chip{padding:7px 12px;font-size:12px}
  .modal{padding:20px 16px}
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <h1>设备管理系统</h1>
    <p class="sub">登记 · 领用 · 报修 · 审核</p>
    <input id="loginUser" placeholder="账号" autocomplete="username">
    <input id="loginPwd" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()">
    <button id="loginBtn" onclick="tryLogin()">登 录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="app">
<div class="layout">
  <div class="sidebar">
    <div class="sb-logo"><span class="dot"></span><span>设备管理系统</span></div>
    <div class="sb-nav" id="sidebar"></div>
    <div class="sb-user">
      <div class="av" id="userAv" onclick="showUserPopup()" title="账号信息" style="cursor:pointer">主</div>
      <div class="u-info">
        <div class="u-name" id="userName">--</div>
        <div class="u-role" id="userRole">--</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px"><div class="logout" onclick="showPwdModal()">改密</div><div class="logout" id="logout" onclick="doLogout()">退出</div></div>
    </div>
  </div>
  <div class="main" id="content"></div>
</div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>

<script>
// ============ 工具 ============
function ubtoa(s){var b=[],i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);if(c<128)b.push(c);else if(c<2048)b.push(192|(c>>6),128|(c&63));else b.push(224|(c>>12),128|((c>>6)&63),128|(c&63));}return btoa(String.fromCharCode.apply(null,b));}
function uatob(s){var bin=atob(s),b=[],i=0,j=0,r="";for(j=0;j<bin.length;j++)b.push(bin.charCodeAt(j));while(i<b.length){var c=b[i];if(c<128){r+=String.fromCharCode(c);i++;}else if(c<224){r+=String.fromCharCode(((c&31)<<6)|(b[i+1]&63));i+=2;}else{r+=String.fromCharCode(((c&15)<<12)|((b[i+1]&63)<<6)|(b[i+2]&63));i+=3;}}return r;}
function nowStr(){var d=new Date(),p=function(n){return String(n).padStart(2,"0");};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function uid(){return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function todayStr(){var d=new Date(),p=function(n){return String(n).padStart(2,"0");};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}

// ============ 本地存储后端 ============
var LK="device_db_v2";
var DEFAULT_FIELDS=[
  {id:"type",label:"设备类型",type:"select",options:["手机","电脑","平板","其他"],required:true},
  {id:"model",label:"手机型号",type:"select",options:["iPhone 13","iPhone 14","iPhone 15","Mate60","Mate60 Pro","Redmi K70","其他"],required:true},
  {id:"phone",label:"手机号码",type:"input",placeholder:"如：13800008888",required:false},
  {id:"card",label:"手机卡类型",type:"select",options:["移动","联通","电信","其他"],required:false},
  {id:"sn",label:"手机编号",type:"input",placeholder:"如：IMEI/SN（不可重复）",required:true},
  {id:"platform",label:"平台",type:"select",options:["抖音","快手","小红书","空"],required:false},
  {id:"nickname",label:"昵称",type:"input",placeholder:"对应平台昵称",required:false},
  {id:"douyin_id",label:"ID",type:"input",placeholder:"如：dy123456",required:false},
  {id:"note",label:"备注",type:"input",placeholder:"其他说明",required:false}
];
var REMOVE_LABELS=["品牌","颜色","设备编号","设备型号"];
function mergeFields(d){
  if(!d||!d.fields)return;
  // v13.4：按 id 去重（曾出现 platform 字段重复导致多列；保留第一个）
  var seen={};
  d.fields=d.fields.filter(function(f){if(!f||!f.id)return true;if(seen[f.id])return false;seen[f.id]=true;return true;});
  // v13.3：平台列改名+选项（抖音/快手/小红书）；是否有抖音号改"是/否"快捷选择
  var pf=d.fields.find(function(x){return x.label==="抖音平台";});
  if(pf){pf.label="平台";pf.options=["抖音","快手","小红书","空"];}
  // v13.27：平台字段选项统一含"空"（兼容云端已改名但缺"空"的情况）
  var pf2=d.fields.find(function(x){return x.id==="platform";});
  if(pf2&&(!pf2.options||pf2.options.indexOf("空")<0))pf2.options=["抖音","快手","小红书","空"];
  var yf=d.fields.find(function(x){return x.label==="是否有抖音号"||x.label==="是否有账号";});
  if(yf){yf.label="是否有抖音号";yf.type="select";yf.options=["是","否"];}
  // v13.4：昵称/ID 列名通用化（选哪个平台，这两列就是那个平台的账号）
  var nf=d.fields.find(function(x){return x.label==="抖音昵称";});
  if(nf)nf.label="昵称";
  var idf=d.fields.find(function(x){return x.label==="抖音ID";});
  if(idf)idf.label="ID";
  d.fields=d.fields.filter(function(f){return REMOVE_LABELS.indexOf(f.label)<0;});
  var mf=d.fields.find(function(x){return x.label==="手机型号"&&x.type==="input";});
  if(mf){mf.type="select";mf.options=["iPhone 13","iPhone 14","iPhone 15","Mate60","Mate60 Pro","Redmi K70","其他"];mf.placeholder="";}
  DEFAULT_FIELDS.forEach(function(f){
    // v13.4：按 id 匹配（label 曾重复导致重复 push）
    var ex=d.fields.find(function(x){return x.id===f.id;});
    if(ex){
      if(f.required!==undefined)ex.required=f.required;
      if(f.placeholder)ex.placeholder=f.placeholder;
    }else{
      d.fields.push(JSON.parse(JSON.stringify(f)));
    }
  });
}
function loadLocal(){try{var d=JSON.parse(localStorage.getItem(LK));if(d)mergeFields(d);return d;}catch(e){return null;}}
function svLocal(){localStorage.setItem(LK,JSON.stringify(D));}
var CLOUD_URL="https://hfafiokmdampruoenkgt.supabase.co";
var CLOUD_KEY="sb_publishable_shABnm73cIBqH3mAvwe9pA_W40JPiae";
var cloudReady=false,cloudPromise=null,lastPull=0,D_DIRTY=false;
function pushCloud(){
  try{
    return fetch(CLOUD_URL+"/rest/v1/app_data?id=eq.1",{method:"PATCH",headers:{apikey:CLOUD_KEY,Authorization:"Bearer "+CLOUD_KEY,"Content-Type":"application/json"},body:JSON.stringify({data:D,updated_at:new Date().toISOString()})});
  }catch(e){return Promise.resolve();}
}
async function pullCloud(force){
  var now=Date.now();
  if(!force&&now-lastPull<8000)return;
  lastPull=now;
  try{
    var res=await fetch(CLOUD_URL+"/rest/v1/app_data?id=eq.1",{headers:{apikey:CLOUD_KEY,Authorization:"Bearer "+CLOUD_KEY}});
    var rows=await res.json();
    if(rows&&rows.length&&rows[0].data&&Object.keys(rows[0].data).length){
      if(D_DIRTY){
        pushCloud();
        return;
      }
      D=rows[0].data;
      if(!D.users)D.users=[];
      if(!D.fields)D.fields=[];
      mergeFields(D);
      ensureSimData();
      svLocal();
    }else{
      pushCloud();
    }
  }catch(e){console.log("云端加载失败",e.message);}
}
function ensureSimData(){
  if(!D.simfields||!D.simfields.length)D.simfields=[{id:"sim_type",label:"运营商",type:"select",options:["移动","联通","电信","其他"],required:true}];
  if(!D.simcards)D.simcards=[];
  if(!D.transfers)D.transfers=[];
  if(!D.shipments)D.shipments=[];
  // v13.8：权限开关配置兜底（主管/组长控制：员工才能编辑手机号/绑定手机）
  if(!D.settings)D.settings={allow_edit_phone:false,allow_edit_sim_bind:false,checkin_enabled:false,checkin_freq_days:3,checkin_msg:"请确认您的电话卡还在手上，丢失请立即上报！"};
  // v13.12：退回原因选项（主管/组长自定义，退回申请时选择，审核后同步到设备/卡数据）
  if(!D.return_opts||!D.return_opts.length)D.return_opts=["账号封禁","老号","没号","注销","其他"];
  // v13.22：设备操作日志（生命周期时间线）
  if(!D.logs)D.logs=[];
}
function ensureCloud(){if(!cloudPromise)cloudPromise=pullCloud().then(function(){cloudReady=true;ensureSimData();});return cloudPromise;}
function sv(){svLocal();D_DIRTY=true;pushCloud().then(function(){setTimeout(function(){D_DIRTY=false;},3000);}).catch(function(){D_DIRTY=false;});}
function initDB(){
  return {
    users:[
      {id:"sup_sulaiman",username:"sulaiman",password:"123456",role:"supervisor",name:"苏来曼",created:nowStr()}
    ],
    fields:[
      {id:"type",label:"设备类型",type:"select",options:["手机","电脑","平板","其他"],required:true},
      {id:"model",label:"手机型号",type:"select",options:["iPhone 13","iPhone 14","iPhone 15","Mate60","Mate60 Pro","Redmi K70","其他"],required:true},
      {id:"phone",label:"手机号码",type:"input",placeholder:"如：13800008888",required:true},
      {id:"card",label:"手机卡类型",type:"select",options:["移动","联通","电信","其他"],required:true},
      {id:"platform",label:"平台",type:"select",options:["抖音","快手","小红书"],required:false},
      {id:"nickname",label:"抖音昵称",type:"input",placeholder:"抖音昵称",required:false},
      {id:"douyin_id",label:"抖音ID",type:"input",placeholder:"如：dy123456",required:false},
      {id:"note",label:"备注",type:"input",placeholder:"其他说明",required:false}
    ],
    assets:[],uses:[],repairs:[],requests:[],transfers:[],shipments:[],
    simfields:[
      {id:"sim_type",label:"运营商",type:"select",options:["移动","联通","电信","其他"],required:true},
      {id:"sim_plan",label:"套餐",type:"input",placeholder:"如：39元/月",required:false},

// ===== 员工账号（主管） =====
function inScope(u,userId){
  if(u.role==="supervisor")return true;
  if(u.role==="member")return userId===u.id;
  if(u.role==="leader"){if(userId===u.id)return true;return D.users.some(function(x){return x.parent_id===u.id&&x.id===userId;});}
  return false;
}
function getUsers(tk){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  var list=[];
  if(u.role==="supervisor"){
    D.users.filter(function(x){return x.role==="leader";}).forEach(function(l){
      var item={id:l.id,name:l.name,username:l.username,role:"leader",created:l.created,members:[]};
      D.users.filter(function(m){return m.role==="member"&&m.parent_id===l.id;}).forEach(function(m){
        item.members.push({id:m.id,name:m.name,username:m.username,created:m.created});
      });
      list.push(item);
    });
    D.users.filter(function(x){return x.role==="member"&&x.parent_id===u.id;}).forEach(function(m){
      list.push({id:m.id,name:m.name,username:m.username,role:"member",created:m.created,members:[]});
    });
  }else if(u.role==="leader"){
    D.users.filter(function(m){return m.role==="member"&&m.parent_id===u.id;}).forEach(function(m){
      list.push({id:m.id,name:m.name,username:m.username,role:"member",created:m.created,members:[]});
    });
  }else if(u.role==="member"){
    // v12.9 修复：员工能看到同组同事（转让弹窗选接收人用），跨组不可见
    D.users.filter(function(m){return m.role==="member"&&m.parent_id===u.parent_id&&m.id!==u.id;}).forEach(function(m){
      list.push({id:m.id,name:m.name,username:m.username,role:"member",created:m.created,members:[]});
    });
  }
  return[200,{users:list,role:u.role}];
}
function postUser(tk,b){

  D.users.push({id:uid(),username:b.username.trim(),password:(b.password||"").trim()||"123456",name:b.name.trim(),role:role,parent_id:u.id,created:nowStr()});

function postRequest(tk,b){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  var type=b.type;
  if(["take","repair","return","delete","edit","ship","sim_take","sim_return","sim_transfer"].indexOf(type)<0)return[400,{error:"类型不合法"}];
  // v13.7：电话卡领用/退回申请（sim_take/sim_return）；v13.9：转卡（sim_transfer）
  if(type==="sim_take"||type==="sim_return"||type==="sim_transfer"){
    var s=(D.simcards||[]).find(function(x){return x.id===b.sim_id;});
    if(!s)return[404,{error:"电话卡不存在"}];
    if(type==="sim_take"){
      if(s.data.sim_status!=="在库"||s.user_id)return[400,{error:"卡不在库，无法申请领用"}];
    }else if(type==="sim_return"){
      if(s.data.sim_status!=="在用")return[400,{error:"卡未在使用中"}];

    D.requests.push({id:uid(),type:type,sim_id:s.id,asset_id:"",asset_name:(s.data.sim_no||"电话卡"),user_id:u.id,user_name:u.name,status:"pending",created:nowStr(),desc:b.desc||"",return_reason:b.return_reason||"",return_note:b.return_note||"",to_user_id:b.to_user_id||"",to_user_name:(type==="sim_transfer"?(D.users.find(function(x){return x.id===b.to_user_id;})||{}).name||"":"")});
    sv();return[200,{ok:true}];
  }
  var a=D.assets.find(function(x){return x.id===b.asset_id;});
  if(!a||a.status==="deleted")return[404,{error:"设备不存在"}];
  // v12.11：外寄中的手机禁止退回/报修/删除/修改申请，只能先寄回
  if(a.status==="shipped"&&type!=="edit")return[400,{error:"手机外寄中，请先确认寄回后再操作"}];
  // 校验
  if(type==="take"){
    if(a.status!=="available")return[400,{error:"设备不在库，无法申请领用"}];
    if(D.uses.find(function(x){return x.asset_id===a.id&&!x.return_time;}))return[400,{error:"设备已被领用"}];
  }
  if(type==="return"){
    if(a.status!=="in_use")return[400,{error:"设备未在使用中"}];
  }
  // v13.14：员工寄出申请（需审核）；主管/组长走直接寄出接口
  if(type==="ship"){
    if(!b.to_where||!String(b.to_where).trim())return[400,{error:"请填写寄给谁/地址"}];
    if(a.status!=="in_use")return[400,{error:"只有在用的设备可申请寄出"}];
    var shipUse=D.uses.find(function(x){return x.asset_id===a.id&&!x.return_time;});
    if(!shipUse||shipUse.user_id!==u.id)return[403,{error:"只能申请寄自己正在用的手机"}];
  }
  if(type==="repair"&&!b.desc)return[400,{error:"请描述故障"}];
  if(type==="delete"&&!b.reason)return[400,{error:"请填写删除原因"}];
  if(type==="edit"){if(!b.field||b.new_value===undefined)return[400,{error:"参数不完整"}];}
  // 重复待审检查
  if(D.requests.find(function(x){return x.type===type&&x.asset_id===a.id&&x.user_id===u.id&&x.status==="pending";}))return[400,{error:"已有待审核的同类型申请"}];
  D.requests.push({id:uid(),type:type,asset_id:a.id,asset_name:assetName(a),user_id:u.id,user_name:u.name,desc:b.desc||"",reason:b.reason||"",note:"",return_reason:b.return_reason||"",return_note:b.return_note||"",to_where:b.to_where||"",ship_reason:b.ship_reason||"",tracking:b.tracking||"",status:"pending",created:nowStr(),handled_by:"",handled_at:"",field:b.field||"",new_value:b.new_value||""});
  sv();return[200,{ok:true}];
}
function approveRequest(tk,id,b){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];

  var r=D.requests.find(function(x){return x.id===id;});

  if(u.role==="leader"&&!inScope(u,r.user_id))return[403,{error:"只能审核自己组的申请"}];
  if(r.status!=="pending")return[400,{error:"该申请已处理"}];
  // v13.7：电话卡领用/退回审核；v13.9：转卡审核
  if(r.type==="sim_take"||r.type==="sim_return"||r.type==="sim_transfer"){
    var s=r.sim_id?(D.simcards||[]).find(function(x){return x.id===r.sim_id;}):null;
    if(r.type==="sim_take"){
      if(!s||s.data.sim_status!=="在库")return[400,{error:"卡状态已变化，无法通过"}];
      s.data.sim_status="在用";s.user_id=r.user_id;s.user_name=r.user_name;
      // v13.12：再次领用后清除退回原因/备注
      delete s.data.return_reason;delete s.data.return_note;
    }else if(r.type==="sim_return"){
      if(!s)return[404,{error:"卡不存在"}];
      s.data.sim_status="在库";delete s.user_id;delete s.user_name;
      // v13.12：退回原因/备注同步到卡数据（所有页面一直显示）
      if(r.return_reason)s.data.return_reason=r.return_reason;
      if(r.return_note)s.data.return_note=r.return_note;
    }else{
      if(!s)return[404,{error:"卡不存在"}];
      var toU=D.users.find(function(x){return x.id===r.to_user_id;});
      if(!toU)return[400,{error:"接收员工不存在"}];
      s.user_id=toU.id;s.user_name=toU.name;
    }
    r.status="approved";r.handled_by=u.name;r.handled_at=nowStr();r.note=b&&b.note?b.note:"";
    sv();return[200,{ok:true}];
  }
  var a=D.assets.find(function(x){return x.id===r.asset_id;});
  // v13.14：寄出申请审核（员工寄出需主管/组长同意）
  if(r.type==="ship"){
    if(!a||a.status!=="in_use")return[400,{error:"设备状态已变化，无法通过"}];
    a.status="shipped";
    D.shipments=(D.shipments||[]).concat([{
      id:uid(),status:"shipped",asset_id:a.id,asset_name:assetName(a),user_id:r.user_id,user_name:r.user_name,
      to_where:r.to_where||"",reason:r.ship_reason||r.reason||"",tracking:r.tracking||"",
      // v13.22：寄出时间=员工点击寄出（提交申请）的时间，不是审核时间
      ship_time:r.created||nowStr(),return_time:"",return_by:"",note:r.note||"",seen:false
    }]);
    r.status="approved";r.handled_by=u.name;r.handled_at=nowStr();
    sv();return[200,{ok:true}];
  }
  if(r.type==="take"){
    if(!a||a.status!=="available")return[400,{error:"设备状态已变化，无法通过"}];
    a.status="in_use";
    // v13.12：再次领用后清除退回原因/备注
    if(a.data){delete a.data.return_reason;delete a.data.return_note;}
    D.uses.push({id:uid(),asset_id:a.id,asset_name:assetName(a),user_id:r.user_id,user_name:r.user_name,take_time:nowStr(),return_time:"",take_req:r.id});
  }else if(r.type==="return"){
    if(!a)return[404,{error:"设备不存在"}];
    var rec=D.uses.find(function(x){return x.asset_id===a.id&&!x.return_time&&x.user_id===r.user_id;});
    if(rec)rec.return_time=nowStr();
    if(a.status==="in_use")a.status="available";
    // v13.12：退回原因/备注同步到设备数据（所有页面一直显示）
    if(r.return_reason)a.data.return_reason=r.return_reason;
    if(r.return_note)a.data.return_note=r.return_note;
  }else if(r.type==="repair"){
    if(!a)return[404,{error:"设备不存在"}];
    if(a.status!=="repairing")a.status="repairing";
    D.repairs.push({id:uid(),asset_id:a.id,asset_name:assetName(a),user_id:r.user_id,user_name:r.user_name,desc:r.desc,status:"repairing",created:nowStr(),updated:nowStr()});
  }else if(r.type==="delete"){
    if(!a)return[404,{error:"设备不存在"}];
    a.status="deleted";
  }else if(r.type==="edit"){
    if(!a)return[404,{error:"设备不存在"}];
    if(!a.data)a.data={};
    a.data[r.field]=r.new_value;
  }
  // v13.22：操作日志
  if(a&&r.type==="take")addLog(a.id,"领用","审核通过领用申请",u.name);
  else if(a&&r.type==="return")addLog(a.id,"归还","审核通过退还申请"+(r.return_reason?"（"+r.return_reason+"）":""),u.name);
  else if(a&&r.type==="repair")addLog(a.id,"报修","审核通过报修："+r.desc,u.name);
  else if(a&&r.type==="delete")addLog(a.id,"删除","审核通过删除申请"+(r.reason?"（"+r.reason+"）":""),u.name);
  else if(a&&r.type==="edit")addLog(a.id,"修改","审核通过修改"+r.field+"→"+r.new_value,u.name);
  r.status="approved";r.handled_by=u.name;r.handled_at=nowStr();r.note=b&&b.note?b.note:"";
  sv();return[200,{ok:true}];
}

  var act=b&&b.action;

    if(t.to_id!==u.id&&u.role!=="supervisor")return[403,{error:"只有接收人能确认"}];
    var a=D.assets.find(function(x){return x.id===t.asset_id;});

    if(a.status!=="repairing"&&a.status!=="scrapped")a.status="in_use";
  // v13.12：转让后清除退回原因/备注（设备已被他人使用）
  if(a.data){delete a.data.return_reason;delete a.data.return_note;}
    t.status="approved";t.handled_at=nowStr();t.handled_note=(b&&b.note)||"";
  }else if(act==="reject"){
    if(t.to_id!==u.id&&u.role!=="supervisor")return[403,{error:"只有接收人能拒绝"}];
    t.status="rejected";t.handled_at=nowStr();t.handled_note=(b&&b.note)||"";

    t.status="cancelled";t.handled_at=nowStr();t.handled_note=(b&&b.note)||"";
  }else{

  }
  sv();return[200,{ok:true}];

function getAssetLogs(tk,id){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  var a=D.assets.find(function(x){return x.id===id;});
  if(!a)return[404,{error:"设备不存在"}];
  var logs=[];
  // 登记
  logs.push({action:"登记",desc:"设备登记入库",user:a.created_by_name||"",time:a.created||""});
  // 领用/归还（uses）
  (D.uses||[]).forEach(function(x){
    if(x.asset_id!==id)return;
    if(x.take_time)logs.push({action:"领用",desc:"领用设备",user:x.user_name||"",time:x.take_time});
    if(x.return_time)logs.push({action:"归还",desc:"归还仓库",user:x.user_name||"",time:x.return_time});
  });
  // 外寄（shipments）
  (D.shipments||[]).forEach(function(x){
    if(x.asset_id!==id)return;
    if(x.ship_time)logs.push({action:"寄出",desc:"寄出→"+(x.to_where||"")+(x.reason?"（"+x.reason+"）":"")+(x.tracking?" 单号"+x.tracking:""),user:x.ship_by_name||x.user_name||"",time:x.ship_time});
    if(x.return_time)logs.push({action:"寄回",desc:"确认寄回",user:x.return_by||"",time:x.return_time});
  });
  // 维修（repairs）
  (D.repairs||[]).forEach(function(x){
    if(x.asset_id!==id)return;
    if(x.created)logs.push({action:"报修",desc:x.desc||"报修",user:x.user_name||"",time:x.created});
    if(x.fixed_at)logs.push({action:"修复",desc:"维修完成",user:x.handled_by||"",time:x.fixed_at});
  });
  // 转让（transfers）
  (D.transfers||[]).forEach(function(x){
    if(x.asset_id!==id)return;
    if(x.created)logs.push({action:"转让",desc:x.from_name+" → "+x.to_name+(x.handled_at?"（已确认）":"（待确认）"),user:x.from_name||"",time:x.created});
  });
  // 删除/报废申请（requests）
  (D.requests||[]).forEach(function(r){
    if(r.asset_id!==id)return;
    if(r.type==="delete"&&r.created)logs.push({action:"删除申请",desc:r.reason||"删除",user:r.user_name||"",time:r.created});
  });
  // 操作日志（logs）
  (D.logs||[]).forEach(function(l){
    if(l.asset_id!==id)logs.push({action:l.action,desc:l.desc,user:l.user,time:l.time});
  });
  // 去重+排序（时间正序）
  logs.sort(function(a,b){return String(a.time||"").localeCompare(String(b.time||""));});
  return[200,{logs:logs}];
}

    if(m.role!=="member"||m.parent_id!==u.id)return[403,{error:"只能修改自己的员工"}];
  }else{
    return[403,{error:"无权限"}];
  }
  var newName=b.name?(b.name||"").trim():m.name;
  var newUser=b.username?(b.username||"").trim():m.username;
  if(!newName||!newUser)return[400,{error:"姓名和账号不能为空"}];
  if(D.users.find(function(x){return x.username===newUser&&x.id!==m.id;}))return[400,{error:"账号已存在"}];
  m.name=newName;m.username=newUser;
  if(b.password)m.password=b.password.trim();
  sv();return[200,{ok:true}];
}

function getStats(tk){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  var assets=D.assets.filter(function(a){return a.status!=="deleted";});
  var uses=D.uses,repairs=D.repairs,reqs=D.requests;
  if(u.role!=="supervisor"){
    uses=uses.filter(function(x){return inScope(u,x.user_id);});
    repairs=repairs.filter(function(x){return inScope(u,x.user_id);});
    reqs=reqs.filter(function(x){return inScope(u,x.user_id);});
    assets=assets.filter(function(a){return inScope(u,a.created_by);});
  }
  var pendingReqs=D.requests.filter(function(x){return x.status==="pending"&&inScope(u,x.user_id);}).length;
  var byType={},byCard={},byModel={};
  assets.forEach(function(a){
    var k=(a.data&&a.data.type)||"其他";
    if(!byType[k])byType[k]={total:0,available:0,in_use:0,repairing:0,scrapped:0};
    byType[k].total++;byType[k][a.status]=(byType[k][a.status]||0)+1;
    var ck=(a.data&&a.data.card)||"其他";byCard[ck]=(byCard[ck]||0)+1;
    var mk=(a.data&&a.data.model)||"未知型号";byModel[mk]=(byModel[mk]||0)+1;
  });
  return[200,{stats:{
    total:assets.length,
    available:assets.filter(function(a){return a.status==="available";}).length,
    inUse:assets.filter(function(a){return a.status==="in_use";}).length,
    repairing:assets.filter(function(a){return a.status==="repairing";}).length,
    scrapped:assets.filter(function(a){return a.status==="scrapped";}).length,
    myUse:uses.filter(function(x){return !x.return_time;}).length,
    pendingReqs:pendingReqs,
    myPending:reqs.filter(function(x){return x.status==="pending";}).length,
    byType:byType,
    byCard:byCard,
    byModel:byModel
  }}];
}

var _of=window.fetch;
window.fetch=function(url,opts){
  var us=(typeof url==="string")?url:(url.url||url.toString());
  if(us.indexOf("/api/")===0){
    opts=opts||{};var method=opts.method||"GET";var body=opts.body?JSON.parse(opts.body):null;
    var tk="";var ah=opts.headers||{};
    if(ah.Authorization&&ah.Authorization.indexOf("Bearer ")==0){tk=ah.Authorization.slice(7);}
    var res=route(method,us,tk,body);
    return Promise.resolve({ok:res[0]<400,status:res[0],json:function(){return Promise.resolve(res[1]);}});
  }
  return _of.apply(this,arguments);
};

async function apiJSON(path,opts){
  try{await pullCloud();}catch(e){}
  var headers={"Content-Type":"application/json"};
  if(opts&&opts.headers)for(var k in opts.headers)headers[k]=opts.headers[k];
  var tk=getToken();if(tk)headers["Authorization"]="Bearer "+tk;
  var res=await fetch(path,Object.assign({method:"GET"},opts||{},{headers:headers}));
  var data={};try{data=await res.json();}catch(_){}
  if(!res.ok)throw new Error((data&&data.error)||"请求失败");
  return data;
}

// v13.11：外寄等待时长（寄出时间 → 当前/寄回时间，单位天）
function shipDays(t1,t2){
  try{
    var d1=new Date(t1.replace(/-/g,"/"));if(isNaN(d1))return "";
    var d2=t2?new Date(t2.replace(/-/g,"/")):new Date();
    var ms=Math.max(0,d2-d1);
    return Math.floor(ms/86400000);
  }catch(e){return "";}
}

async function batchHandle(action){
  var ids=selectedIds();

  var note="";
  if(action==="reject"){note=prompt("批量拒绝原因（可选）：")||"";}
  else{note=prompt("备注（可选）：")||"";}
  try{
    var r=await apiPost("/api/requests/batch",{ids:ids,action:action,note:note});
    toast(action==="approve"?"✔ 已批量同意 "+r.count+" 条":"✘ 已批量拒绝 "+r.count+" 条");

async function submitHandle(id,action){

  var permData=await apiGet("/api/settings");
  var allowPhone=permData.settings&&permData.settings.allow_edit_phone;
  var f=document.getElementById("astFilter")?document.getElementById("astFilter").value:"";
  var kw=document.getElementById("astSearch")?(document.getElementById("astSearch").value||"").trim():"";
  // v13.24：按人查看过滤=当前在用者；退回仓库(无在用)不归任何人，只在全部显示
  var userMatch=function(a){if(!ASSET_FILTER)return true;var u2=(useData.uses||[]).find(function(x){return x.asset_id===a.id&&!x.return_time;});return u2&&u2.user_id===ASSET_FILTER;};
  // v13.28：按平台过滤（抖音/快手/小红书 多选匹配，空=未选平台）
  var platMatch=function(a){
    if(!ASSET_PLATFORM)return true;
    var wp=((a.data&&a.data.platform)||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
    if(ASSET_PLATFORM==="空")return !wp.length;
    return wp.indexOf(ASSET_PLATFORM)>=0;
  };
  var list=data.assets.filter(function(a){return userMatch(a)&&platMatch(a)&&(!f||a.status===f)&&(!kw||(assetName(a)+" "+(a.data&&a.data.sn||"")+" "+(a.data&&a.data.model||"")+" "+(a.data&&a.data.phone||"")+" "+(a.data&&a.data.nickname||"")+" "+(a.data&&a.data.douyin_id||"")+" "+(a.data&&a.data.note||"")+" "+a.created_by_name).indexOf(kw)>=0);});
  var h="";
  list.forEach(function(a){
    var d=a.data||{};
    var myUse=useData.uses.find(function(x){return x.asset_id===a.id&&!x.return_time;});
    // v13.2：使用人仅显示实际在用者；退回仓库后在库设备使用人为空
    var showUser=myUse?myUse.user_name:"";
    // v12.6：动态字段列（v13.1：抖音ID/昵称对员工隔离——只显示自己使用中的手机，别人的隐藏）
    // v13.4：平台/是否有抖音号 常驻快捷选择（点选即存）；其他列单击编辑
    var extraTds="";
    var isMine=STATE.user.role==="member"&&myUse&&myUse.user_id===STATE.user.id;
    (fieldsData.fields||[]).forEach(function(f){
      if(["type","model","sn","phone"].indexOf(f.id)>=0)return;
      var hidden=(f.id==="douyin_id"||f.id==="nickname")&&STATE.user.role==="member"&&!isMine;
      if(hidden){
        extraTds+="<td><span style=\"color:var(--faint)\">—</span></td>";
        return;
      }
      var fv=d[f.id];
      var isQuick=(f.type==="select"&&(f.label==="平台"||f.label==="是否有抖音号"));
      if(isQuick&&f.options){
        // v13.25：平台=多选（抖音/快手/小红书 可同时选，逗号分隔）；是否有抖音号=单选
        var isPlat=f.label==="平台";
        var chips="";
        (f.options||[]).forEach(function(o){
          // v13.27："空"=未选任何平台时自动高亮（空手机）；点击清空
          var on=isPlat?(o==="空"?(!fv):(","+(fv||"")+",").indexOf(","+o+",")>=0):(fv===o);
          var fn=isPlat?("togglePlatform('"+a.id+"','"+esc(o)+"')"):("inlineSave('"+a.id+"','"+f.id+"','"+esc(o)+"')");
          chips+="<span class=\"chip"+(on?" on":"")+"\" data-v=\""+esc(o)+"\" onclick=\""+fn+"\" style=\"padding:2px 8px;font-size:11px;margin:1px 2px\">"+esc(o)+"</span>";
        });
        extraTds+="<td style=\"white-space:nowrap\">"+chips+"</td>";
      }else{
        var ft=(f.type==="select"?"select":"input");
        extraTds+="<td title=\"单击编辑\" onclick=\"inlineEdit('"+a.id+"','"+f.id+"','"+ft+"',this)\" style=\"cursor:pointer\">"+(fv?esc(fv):"<span style=\"color:var(--faint)\">—</span>")+"</td>";
      }
    });
    // v12.4：设备/型号/编号/手机号独立列；v13.8：手机号列受权限开关控制（开→单击可编辑）
    var phoneTd=allowPhone?("<td title=\"单击编辑手机号\" onclick=\"inlineEdit('"+a.id+"','phone','input',this)\" style=\"cursor:pointer\">"+(d.phone?esc(d.phone):"<span style=\"color:var(--faint)\">—</span>")+"</td>"):("<td>"+esc(d.phone||"—")+"</td>");
    h+="<tr><td><b>"+esc(d.type||"—")+"</b></td><td>"+esc(d.model||"—")+"</td><td>"+esc(d.sn||"—")+" <button class=\"link-btn\" onclick=\"showScanModal('"+a.id+"')\" title=\"扫码登记抖音账号\">📷</button></td>"+phoneTd+extraTds+"<td><button class=\"link-btn\" onclick=\"filterByUser(this)\" data-v=\""+a.created_by+"\">"+esc(a.created_by_name)+"</button></td><td>"+(showUser?"<b>"+esc(showUser)+"</b>":"<span style=\"color:var(--faint)\">—</span>")+"</td>"+"<td>"+simTag(a)+"</td><td>"+assetTag(a.status)+returnTag(d)+"</td>"+noteTd(d,a)+"<td class=\"num\">"+esc(a.created)+"</td><td>";
    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-ghost\" onclick=\"openEditAsset('"+a.id+"',0)\" style=\"margin-right:6px\">编辑</button> <button class=\"btn btn-sm btn-ghost\" onclick=\"showAssetHistory('"+a.id+"')\" style=\"margin-right:6px\">📜 历史</button>";
    // v13.31：主管/组长直接报修（在库/在用/外寄中可报修；维修中/报废/删除不显示）
    if(STATE.user.role!=="member"&&a.status!=="repairing"&&a.status!=="deleted"&&a.status!=="scrapped")h+="<button class=\"btn btn-sm btn-orange\" onclick=\"showRepairAsset('"+a.id+"')\" style=\"margin-right:6px\">🔧 维修</button>";
    if(a.status==="available"){
      h+="<button class=\"btn btn-sm btn-green\" onclick=\"showDirectTake('"+a.id+"')\">直接领用</button> ";
      h+="<button class=\"btn btn-sm btn-danger\" onclick=\"directDelAsset('"+a.id+"')\">删除</button>";
  }else if(a.status==="in_use"){
    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-green\" onclick=\"returnByAsset('"+a.id+"')\" style=\"margin-right:6px\">归还</button>";
    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-blue\" onclick=\"toWarehouseAsset('"+a.id+"')\" style=\"margin-right:6px\">转仓库</button>";
    // v13.11：主管/组长也可寄出（与员工我的设备一致）
    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-purple\" onclick=\"showShip('"+a.id+"')\" style=\"margin-right:6px\">寄出</button>";
    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-danger\" onclick=\"directDelAsset('"+a.id+"')\" style=\"margin-right:6px\">删除</button>";
    h+="<span style=\"color:var(--faint);font-size:12px\">使用中</span>";
  }else if(a.status==="repairing"){
      if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-danger\" onclick=\"directDelAsset('"+a.id+"')\" style=\"margin-right:6px\">删除</button>";
      h+="<span style=\"color:var(--faint);font-size:12px\">维修中</span>";
  }else if(a.status==="shipped"){
    // v12.11：外寄中——主管/组长可代确认寄回；v13.11：显示已寄出天数
    if(STATE.user.role!=="member")h+="<button class=\"btn btn-sm btn-green\" onclick=\"shipReturn('"+a.id+"')\" style=\"margin-right:6px\">确认寄回</button>";
    var shRec=(D.shipments||[]).find(function(x){return x.asset_id===a.id&&x.status==="shipped";});
    h+="<span style=\"color:var(--faint);font-size:12px\">外寄中"+(shRec&&shRec.ship_time?(" · 已寄出 "+shipDays(shRec.ship_time)+" 天"):"")+"</span>";
  }else{
      h+="<span style=\"color:var(--faint);font-size:12px\">已报废</span>";
    }
    h+="</td></tr>";
  });
  var extraCnt=fieldsData.fields?fieldsData.fields.filter(function(f){return ["type","model","sn","phone"].indexOf(f.id)<0;}).length:0;
  if(!h)h="<tr><td colspan=\""+(9+extraCnt)+"\" class=\"empty\">暂无设备</td></tr>";
  document.getElementById("assetTableBody").innerHTML=h;
}
// ===== v13.3：台账双击内联编辑（平台/是否有抖音号快捷选择、备注等直接输入）=====
async function inlineEdit(assetId, fieldId, type, td){
  try{
    var fieldsData=await apiGet("/api/fields");
    var f=(fieldsData.fields||[]).find(function(x){return x.id===fieldId;});
    var assetsData=await apiGet("/api/assets");
    var a=assetsData.assets.find(function(x){return x.id===assetId;});
    if(!a){toast("设备不存在","err");return;}
    var cur=(a.data&&a.data[fieldId])||"";
    var html="";
    if(type==="select"&&f&&f.options&&f.options.length){
      var chips="";
      (f.options||[]).forEach(function(o){
        chips+="<span class=\"chip"+(cur===o?" on":"")+"\" data-v=\""+esc(o)+"\" onclick=\"event.stopPropagation();inlineSave('"+assetId+"','"+fieldId+"','"+esc(o)+"')\">"+esc(o)+"</span>";
      });
      html="<div class=\"chip-row\" style=\"white-space:nowrap\">"+chips+"</div>";
    }else{
      html="<input value=\""+esc(cur)+"\" onclick=\"event.stopPropagation()\" style=\"width:140px;box-sizing:border-box;padding:4px 8px;border:1.5px solid var(--line);border-radius:7px;font-size:13px\" onkeydown=\"if(event.key==='Enter')inlineSaveInput('"+assetId+"','"+fieldId+"',this.value)\" onblur=\"renderAssetTable()\">";
    }
    td.innerHTML=html;
    var inp=td.querySelector("input");if(inp)inp.focus();
  }catch(e){toast(e.message,"err");}
}
async function inlineSave(assetId, fieldId, value){await doInlineSave(assetId,fieldId,value);}
// v13.25：平台多选切换（逗号分隔存储）——员工/主管都可点（员工走 edit_my_asset，可改在库设备）
async function togglePlatform(assetId, plat){
  try{
    // v13.26：改用本地 D.assets（apiGet /api/assets 对员工过滤，仓库里别人登记的在库手机查不到）
    var a=D.assets.find(function(x){return x.id===assetId;});
    if(!a){toast("设备不存在","err");return;}
    var cur=(a.data&&a.data.platform)||"";
    var arr=(cur||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
    // v13.27：点"空"=清空所有平台（空手机）
    if(plat==="空"){arr=[];}
    else{
      var idx=arr.indexOf(plat);
      if(idx>=0)arr.splice(idx,1);else arr.push(plat);
    }
    var val=arr.join(",");
    await doInlineSave(assetId,"platform",val);
  }catch(e){toast(e.message,"err");}
}
async function inlineSaveInput(assetId, fieldId, value){await doInlineSave(assetId,fieldId,value);}

async function renderAssetForm(){
  var data=await apiGet("/api/fields");
  var h="";
  data.fields.forEach(function(f){
    h+="<div class=\"field\"><label>"+esc(f.label)+(f.required?"<span class=\"req\"> *</span>":"")+"</label>";
    if(f.type==="select"){
      h+="<div class=\"chip-row\" id=\"f_"+f.id+"\">";
      f.options.forEach(function(o){h+="<span class=\"chip\" data-v=\""+esc(o)+"\" onclick=\"pickChip(this)\">"+esc(o)+"</span>";});

function pickChip(el){
  var row=el.parentNode;
  Array.prototype.forEach.call(row.children,function(c){c.classList.remove("on");});
  el.classList.add("on");
}
function getFieldValue(fid){
  var el=document.getElementById("f_"+fid);
  if(!el)return "";
  if(el.classList&&el.classList.contains("chip-row")){
    var c=el.querySelector(".chip.on");
    return c?c.getAttribute("data-v"):"";
  }
  return el.value.trim();
}
async function addAsset(mode){
  var data=await apiGet("/api/fields");
  var fd={};
  var snId="";
  for(var i=0;i<data.fields.length;i++){
    var f=data.fields[i];
    var v=getFieldValue(f.id);
    if(f.required&&!v){document.getElementById("a_err").textContent="请选择「"+f.label+"」";return;}
    fd[f.id]=v;
    if(f.label==="手机编号")snId=f.id;
  }
  try{
    await apiPost("/api/assets",{data:fd});
    if(mode==="next"){
      if(snId){var el=document.getElementById("f_"+snId);if(el)el.value="";}
      var e=document.getElementById("a_err");if(e)e.textContent="";
      toast("✅ 已登记，改编号可继续录入");
      var fs=document.getElementById("f_"+snId);if(fs)fs.focus();
    }else{
      toast("登记成功");closeModal();
      if(STATE.user.role==="member"){renderMyDevList();}else{renderAssetTable();}
    }
  }catch(e){document.getElementById("a_err").textContent=e.message;}
}
// ===== 编辑设备弹窗 =====
var EDIT_ORIG=null,EDIT_LOCKIDS=[];
async function openEditAsset(id,isMember){
  try{
    var data=await apiGet("/api/fields");
    var permData=await apiGet("/api/settings");
    var allowPhone=permData.settings&&permData.settings.allow_edit_phone;
    // v13.26：改用本地 D.assets（apiGet /api/assets 对员工过滤��仓库在库设备查不到会误报"设备不存在"）
    var a=D.assets.find(function(x){return x.id===id;});
    if(!a){toast("设备不存在","err");return;}
    EDIT_ORIG=a.data||{};
    var lockLabels=["手机型号","手机编号"];
    EDIT_LOCKIDS=[];
    data.fields.forEach(function(f){if(lockLabels.indexOf(f.label)>=0)EDIT_LOCKIDS.push(f.id);});
    var locked=(isMember===1||isMember==="1");
    var h="<h3>编辑设备"+(locked?"（型号/编号修改需审核）":"")+"</h3><div id=\"assetForm\">";
    data.fields.forEach(function(f){
      var cur=(a.data&&a.data[f.id])?a.data[f.id]:"";
      var lock=locked&&EDIT_LOCKIDS.indexOf(f.id)>=0;
      // v13.8：手机号编辑受权限开关控制（开关关→禁用）
      var phoneLock=(f.id==="phone"&&!allowPhone);
      var lockTip=phoneLock?"（需在选项管理开启权限）":(lock?"（修改需审核）":"");
      h+="<div class=\"field\"><label>"+esc(f.label)+(f.required?"<span class=\"req\"> *</span>":"")+(lockTip?"<span style=\"color:var(--orange);font-size:11px\">"+lockTip+"</span>":"")+"</label>";
      if(f.type==="select"){
        h+="<div class=\"chip-row\" id=\"f_"+f.id+"\">";
        f.options.forEach(function(o){h+="<span class=\"chip"+(cur===o?" on":"")+"\" data-v=\""+esc(o)+"\" onclick=\"pickChip(this)\" style=\"opacity:"+(lock||phoneLock?"0.5":"1")+"\">"+esc(o)+"</span>";});
        h+="</div>";
      }else{
        h+="<input id=\"f_"+f.id+"\" placeholder=\""+esc(f.placeholder||"请输入")+"\" value=\""+esc(cur)+"\" "+(lock||phoneLock?"disabled":"")+">";
      }
      h+="</div>";
    });
    h+="</div><div class=\"m-btns\"><button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消</button><button class=\"btn btn-primary\" onclick=\"saveEditAsset('"+id+"','"+(locked?"1":"0")+"')\">保存修改</button></div><div class=\"err\" id=\"a_err\"></div>";
    showModal(h);
  }catch(e){toast(e.message,"err");}
}
async function saveEditAsset(id,isMember){
  var data=await apiGet("/api/fields");
  var locked=isMember==="1";
  var fd={};
  for(var i=0;i<data.fields.length;i++){
    var f=data.fields[i];
    if(locked&&EDIT_LOCKIDS.indexOf(f.id)>=0){fd[f.id]=EDIT_ORIG[f.id]||"";continue;}
    var v=getFieldValue(f.id);
    if(f.required&&!v){document.getElementById("a_err").textContent="请选择「"+f.label+"」";return;}
    fd[f.id]=v;
  }
  try{
    if(locked){
      var editReqs=[];
      var direct={};
      for(var j=0;j<data.fields.length;j++){
        var fj=data.fields[j];
        var vj=getFieldValue(fj.id);
        if(EDIT_LOCKIDS.indexOf(fj.id)>=0){
          if(vj!==(EDIT_ORIG[fj.id]||""))editReqs.push({field:fj.id,label:fj.label,new_value:vj});
        }else{
          direct[fj.id]=vj;
        }
      }
      if(Object.keys(direct).length)await apiPost("/api/actions/edit_my_asset",{asset_id:id,data:direct});
      for(var k=0;k<editReqs.length;k++){
        await apiPost("/api/requests",{type:"edit",asset_id:id,field:editReqs[k].field,new_value:editReqs[k].new_value});
      }
      toast(editReqs.length?"已保存，型号/编号修改已提交审核":"已保存");closeModal();
      renderMyDevList();
    }else{
      await apiPost("/api/actions/edit_asset",{asset_id:id,data:fd});
      toast("已保存");closeModal();
      renderAssetTable();
    }
  }catch(e){document.getElementById("a_err").textContent=e.message;}
}

async function renderUses(){

    var h="<span style=\"font-size:12px;color:var(--faint);line-height:28px\">"+label+"：</span>";
    h+="<span class=\"chip"+(cur===""?" on":"")+"\" data-v=\"\" onclick=\""+onClick+"('',this)\">全部 ("+ships.length+")</span>";
    Object.keys(map).forEach(function(v){
      h+="<span class=\"chip"+(cur===v?" on":"")+"\" data-v=\""+esc(v)+"\" onclick=\""+onClick+"('"+esc(v)+"',this)\">"+esc(v)+" ("+map[v]+")</span>";
    });
    bar.innerHTML=h;
  };
  var reasonMap=cnt("reason"),userMap=cnt("user_name"),modelMap=cnt("asset_model");
  buildBar("shipReasonBar","原因",reasonMap,SHIP_FILTER_REASON,"filterShipReason");
  buildBar("shipUserBar","员工",userMap,SHIP_FILTER_USER,"filterShipUser");
  buildBar("shipModelBar","型号",modelMap,SHIP_FILTER_MODEL,"filterShipModel");

// v13.21：外寄记录统一过滤（搜索+原因+员工+型号）
function shipFilterPass(s){
  if(SHIP_FILTER_REASON&&(s.reason||"")!==SHIP_FILTER_REASON)return false;
  if(SHIP_FILTER_USER&&(s.user_name||"")!==SHIP_FILTER_USER)return false;
  if(SHIP_FILTER_MODEL&&(s.asset_model||"")!==SHIP_FILTER_MODEL)return false;
  var kw=document.getElementById("shipSearch")?(document.getElementById("shipSearch").value||"").trim():"";
  if(kw){
    var hay=((s.asset_name||"")+" "+(s.asset_model||"")+" "+(s.asset_sn||"")+" "+(s.user_name||"")+" "+(s.to_where||"")+" "+(s.tracking||"")).toLowerCase();
    if(hay.indexOf(kw.toLowerCase())<0)return false;
  }
  return true;
}

async function renderCheckinSetting(){
  var body=document.getElementById("checkinBody");if(!body)return;
  try{
    var data=await apiGet("/api/settings");

      +"<label style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer;font-size:14px\"><span><b>开启电话卡签到</b><div style=\"font-size:12px;color:var(--faint)\">开启后，在用的电话卡需定期签到确认（防丢）；关闭则全员无需签到</div></span><input type=\"checkbox\" id=\"ckEnable\" style=\"width:18px;height:18px;flex-shrink:0\" "+(s.checkin_enabled?"checked":"")+" onchange=\"saveCheckin()\"></label>"
      +"<div class=\"field\"><label>签到周期（天）</label><input id=\"ckFreq\" type=\"number\" min=\"1\" max=\"90\" value=\""+(s.checkin_freq_days||3)+"\" style=\"max-width:120px\" onchange=\"saveCheckin()\"></div>"

      +"<div style=\"font-size:12px;color:var(--sub)\">今日统计：应签到 <b>"+need+"</b> 张 ｜ 已签到 <b>"+done+"</b> 张 ｜ 未签到 <b class=\"num\" style=\"color:var(--red)\">"+(need)+"</b> 张</div>"

  var ids=Array.prototype.map.call(document.querySelectorAll(".sw-chk:checked"),function(c){return c.value;});
  var uid=document.getElementById("swAssignUser")?document.getElementById("swAssignUser").value:"";
  if(!ids.length){toast("请先勾选要分配的电话卡","err");return;}
  if(!uid){toast("请选择接收的员工","err");return;}
  var ok=0,fail=0;
  try{

      else extraTds+="<td>"+disp+"</td>";

    // v13.7：使用人 = 领用者；在用卡可退回仓库；审核中标记
    var isUseMine=s.user_id===STATE.user.id;
    var myReq=reqs.find(function(x){return x.sim_id===s.id&&x.status==="pending";});

    if(myReq)useTd+=" <span class=\"tag tag-orange\" style=\"font-size:11px;padding:2px 8px\">审核中</span>";
    // v13.12：退回原因/备注标签（卡退回后在库，显示在所有页面直到再次领用或被修改）
    var retTag=returnTag(d);
    // v13.16：绑定手机列可单击编辑（输入手机编号即绑定）——员工可改自己登记/领用的卡，主管/组长可改所有

    if(simNeedCheckin(s)&&canManage)h+=" <button class=\"btn btn-sm btn-green\" onclick=\"simCheckin('"+s.id+"')\">签到</button>";

// v13.33：电话卡签到 helper——判断卡是否需要签到（在用卡 + 超过间隔天数）
function simNeedCheckin(s){
  try{
    var st=D.settings||{};
    if(!st.checkin_enabled)return false;
    var d=s.data||{};
    if(d.sim_status!=="在用")return false;
    if(!s.last_checkin)return true;
    var freq=(parseInt(st.checkin_freq_days,10)||3)*86400000;
    var last=new Date(String(s.last_checkin).replace(/-/g,"/")).getTime();
    if(isNaN(last))return true;
    return (Date.now()-last)>=freq;
  }catch(e){return false;}
}
function simCheckinTag(s){
  if(!s)return "";
  var st=D.settings||{};
  if(!st.checkin_enabled)return "";
  var d=s.data||{};
  if(d.sim_status!=="在用")return "";
  if(simNeedCheckin(s)){
    return "<span class=\"tag tag-red\" style=\"font-size:11px;padding:2px 8px;margin-left:4px\">⚠ 待签到</span>";
  }
  var last=String(s.last_checkin||"").slice(5,16);
  return "<span class=\"tag tag-green\" style=\"font-size:11px;padding:2px 8px;margin-left:4px\">✓ 已签 "+(last||"—")+"</span>";
}

async function simBindSave(simId, snInput){
  var sn=(snInput||"").trim();
  if(!sn){toast("请输入手机编号","err");return;}
  try{
    // 直接查设备数据，不依赖 __simAssets（更健壮）
    var assetsData=await apiGet("/api/assets");
    var assets=assetsData.assets||[];
    var asset=null;
    for(var i=0;i<assets.length;i++){
      var dd=assets[i].data||{};
      var key=String(dd.sn||"").trim();
      if(key===sn||key.indexOf(sn)>=0||sn.indexOf(key)>=0){asset=assets[i];break;}
    }
    if(!asset){toast("未找到该编号的手机，请核对编号","err");renderSimTable();return;}
    var body={id:simId,asset_id:asset.id};
    await apiPost("/api/sims/update",body);
    toast("已绑定 "+(asset.data&&asset.data.model||"")+" 编号:"+asset.data.sn);
  }catch(e){toast(e.message,"err");}
  renderSimTable();
}

function onPick(inp){

function compressImage(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    try{
      var max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*scale));
      c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.85));
    }catch(e){setScanErr("图片处理失败："+e.message);}
  };
  img.onerror=function(){setScanErr("图片读取失败，请重试");};
  img.src=dataUrl;
}

        {type:"text",text:"这是一张抖音个人主页截图。请提取页面上的抖音账号信息，只输出JSON（不要markdown代码块，不要任何解释）：{\"nickname\":\"页面上的昵称\",\"douyin_id\":\"页面上的抖音号\"}。识别不到就填空字符串。"}
      ]}]
    })

    if(!content){setScanErr("识别失败："+((j.error&&j.error.message)||"无返回")+"，可手动填写");return;}
    showOcrResult(parseOcrJson(content));
  }).catch(function(e){
    setScanErr("识别失败："+e.message+"，可手动填写");
  });
}
// 解析模型输出（容忍 ```json 围栏 / 多余文字 / 模型跑偏）
function parseOcrJson(content){
  var info={nick:"",id:""},t=String(content||"");
  var m=t.match(/\{[\s\S]*\}/);
  if(m){
    try{
      var o=JSON.parse(m[0]);
      info.nick=String(o.nickname||o.nick||o.name||"").trim();
      info.id=String(o.douyin_id||o.douyinId||o.id||o.dyid||"").trim();
    }catch(e){}
  }
  if(!info.id&&!info.nick){
    var tm=t.match(/抖音号\s*[:：是]?\s*([A-Za-z0-9_\-]{4,})/);
    if(tm)info.id=tm[1];
    // 优先精确匹配"昵称：xxx" / "昵称是 xxx"
    var nm=t.match(/昵称\s*[:：是]?\s*([^\n，,。！!？?]{1,25})/);
    if(nm)info.nick=nm[1].trim();
    if(!info.nick){
      var bad=["抖音","扫一扫","关注","图片","显示","内容","以上","就是","请","只","返回","识别","页面","提取","这是"];
      var lines=t.split("\n").map(function(s){return s.trim();}).filter(function(s){return s&&s.length<25&&s.indexOf(":")<0&&s.indexOf("：")<0;});
      for(var i=0;i<lines.length;i++){
        var L=lines[i],isBad=false;
        for(var j=0;j<bad.length;j++){if(L.indexOf(bad[j])>=0){isBad=true;break;}}
        if(!isBad){info.nick=L;break;}
      }
    }
  }
  return info;
}

  var note=document.getElementById("rr_note")?document.getElementById("rr_note").value.trim():"";
  try{await apiPost("/api/requests",{type:"return",asset_id:id,return_reason:reason,return_note:note});toast("已提交，等待审核");closeModal();renderMyDevList();refreshBadges();}catch(e){toast(e.message,"err");}
}
function reqDelete(id){
  showModal("<h3>删除设备申请</h3>"
    +"<div class=\"field\"><label>删除原因</label><input id=\"d_reason\" placeholder=\"如：设备已损坏\"></div>"
    +"<div style=\"font-size:12px;color:var(--orange)\">⚠ 提交后需主管审核同意才会删除</div>"
    +"<div class=\"m-btns\"><button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消</button><button class=\"btn btn-danger\" onclick=\"submitDelete('"+id+"')\">提交申请</button></div><div class=\"err\" id=\"d_err\"></div>");
}
async function submitDelete(id){
  var reason=document.getElementById("d_reason").value.trim();
  if(!reason){document.getElementById("d_err").textContent="请填写删除原因";return;}
  try{await apiPost("/api/requests",{type:"delete",asset_id:id,reason:reason});toast("已提交，等待审核");closeModal();renderMyDevList();refreshBadges();}catch(e){document.getElementById("d_err").textContent=e.message;}
}

// ===== 员工：报修申请 =====
async function renderMyMain(){
  var data=await apiGet("/api/stats");
  var transfers=await apiGet("/api/transfers");
  var h="<div class=\"page-title\">我的申请</div><div class=\"page-desc\">报修申请、手机/电话卡转让与所有申请进度</div>";
  h+="<div class=\"mb\"><button class=\"btn btn-orange\" onclick=\"showMyRepair()\">🔧 申请报修</button></div>";
  // v12.8：待我确认的转让
  var waitMe=transfers.transfers.filter(function(t){return t.status==="pending"&&t.to_id===STATE.user.id;});
  h+="<div class=\"card\"><div class=\"c-head\"><h3>待我确认的转让"+(waitMe.length?" <span class=\"nav-badge\" style=\"display:inline-flex;vertical-align:middle\">"+waitMe.length+"</span>":"")+"</h3></div><div class=\"c-body\" id=\"tfWaitBody\">";
  if(waitMe.length){
    waitMe.forEach(function(t){
      h+="<div class=\"req-item\"><div class=\"r-top\"><span class=\"tag tag-blue\">转让</span><b>"+esc(t.asset_name)+"</b><span style=\"color:var(--faint);font-size:12px\">"+esc(t.from_name)+" 转给你 · "+esc(t.created)+"</span></div>"
        +(t.note?"<div class=\"r-desc\">备注："+esc(t.note)+"</div>":"")
        +"<div class=\"m-btns\" style=\"margin-top:8px\"><button class=\"btn btn-sm btn-green\" onclick=\"actTransfer('"+t.id+"','approve')\">✅ 同意接收</button> <button class=\"btn btn-sm btn-danger\" onclick=\"actTransfer('"+t.id+"','reject')\">拒绝</button></div></div>";
    });
  }else{
    h+="<div class=\"empty\">暂无待确认的转让</div>";
  }
  h+="</div></div>";
  // 我发起的转让
  var myTf=transfers.transfers.filter(function(t){return t.from_id===STATE.user.id;});
  h+="<div class=\"card\"><div class=\"c-head\"><h3>我发起的转让</h3></div><div class=\"c-body\" id=\"tfMyBody\">";
  if(myTf.length){
    var stTag={pending:["待确认","tag-orange"],approved:["已转让","tag-green"],rejected:["已拒绝","tag-red"],cancelled:["已撤销","tag-gray"]};
    myTf.forEach(function(t){
      var st=stTag[t.status]||["",""];
      h+="<div class=\"req-item\"><div class=\"r-top\"><span class=\"tag tag-blue\">转让</span><b>"+esc(t.asset_name)+"</b><span class=\"tag "+st[1]+"\">"+st[0]+"</span><span style=\"color:var(--faint);font-size:12px\">给 "+esc(t.to_name)+" · "+esc(t.created)+"</span></div>"
        +(t.note?"<div class=\"r-desc\">备注："+esc(t.note)+"</div>":"")
        +(t.handled_at?(t.status==="approved"?"<div class=\"r-note\">"+esc(t.to_name)+" 已同意 · "+esc(t.handled_at)+"</div>":(t.status==="rejected"?"<div class=\"r-note\">"+esc(t.to_name)+" 已拒绝 · "+esc(t.handled_at)+(t.handled_note?" · "+esc(t.handled_note):"")+"</div>":"")):"")
        +(t.status==="pending"?"<button class=\"btn btn-sm btn-danger\" style=\"margin-top:6px\" onclick=\"actTransfer('"+t.id+"','cancel')\">撤销</button>":"");
      h+="</div>";
    });
  }else{
    h+="<div class=\"empty\">暂无发起的转让</div>";
  }
  h+="</div></div>";
  h+="<div class=\"card\"><div class=\"c-head\"><h3>申请记录</h3></div><div class=\"c-body\" id=\"myReqBody\"></div></div>";
  document.getElementById("content").innerHTML=h;
  renderMyReq();
}
// v12.8：确认/拒绝/撤销转让
async function actTransfer(id,action){
  var names={approve:"确认同意接收该手机？",reject:"确认拒绝？拒绝后对方可转给其他人",cancel:"确认撤销该转让？"};
  if(!confirm(names[action]))return;
  try{
    await apiPost("/api/transfers/"+id,{action:action});
    toast(action==="approve"?"已同意，手机已归你使用":"已处理");renderMyMain();refreshBadges();
  }catch(e){toast(e.message,"err");}
}
async function showMyRepair(){
  var data=await apiGet("/api/assets");
  var list=data.assets.filter(function(a){return a.status!=="deleted"&&a.status!=="scrapped";});
  if(!list.length){toast("没有可报修的设备","err");return;}
  var opts="<option value=\"\">请选择设备</option>";
  list.forEach(function(a){opts+="<option value=\""+a.id+"\">"+esc(assetName(a))+"</option>";});
  showModal("<h3>申请报修</h3>"
    +"<div class=\"field\"><label>选择设备</label><select id=\"r_asset\">"+opts+"</select></div>"
    +"<div class=\"field\"><label>故障描述</label><textarea id=\"r_desc\" placeholder=\"描述故障现象…\"></textarea></div>"
    +"<div style=\"font-size:12px;color:var(--orange)\">⚠ 提交后需主管审核同意才会维修</div>"
    +"<div class=\"m-btns\"><button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消</button><button class=\"btn btn-primary\" onclick=\"submitRepair()\">提交申请</button></div><div class=\"err\" id=\"r_err\"></div>");
}
async function submitRepair(){
  var aid=document.getElementById("r_asset").value;
  var desc=document.getElementById("r_desc").value.trim();
  if(!aid){document.getElementById("r_err").textContent="请选择设备";return;}
  if(!desc){document.getElementById("r_err").textContent="请描述故障";return;}
  try{await apiPost("/api/requests",{type:"repair",asset_id:aid,desc:desc});toast("已提交，等待审核");closeModal();renderMyReq();refreshBadges();}catch(e){document.getElementById("r_err").textContent=e.message;}
}
async function renderMyReq(){
  var data=await apiGet("/api/requests");
  var h="";
  data.requests.forEach(function(r){
    var detail=r.type==="repair"?("故障："+esc(r.desc)):(r.type==="delete"?("原因："+esc(r.reason)):(r.type==="edit"?("修改："+esc(r.field==="model"?"手机型号":"手机编号")+" → "+esc(r.new_value)):(r.type==="sim_transfer"?("转给："+esc(r.to_user_name||"—")):(r.type==="ship"?("寄往："+esc(r.to_where||"—")+(r.ship_reason?" · "+esc(r.ship_reason):"")):""))));
    h+="<div class=\"req-item\"><div class=\"r-top\">"+reqTypeTag(r.type)+"<b>"+esc(r.asset_name)+"</b>"+reqStatusTag(r.status)+"<span style=\"color:var(--faint);font-size:12px\">"+esc(r.created)+"</span></div>"
      +(detail?"<div class=\"r-desc\">"+detail+"</div>":"")
      +(r.status!=="pending"?("<div class=\"r-note\">处理人："+esc(r.handled_by||"—")+" · "+esc(r.handled_at||"—")+(r.note?" · "+esc(r.note):"")+"</div>"):"");
    h+="</div>";
  });
  if(!h)h="<div class=\"empty\">暂无申请记录</div>";
  document.getElementById("myReqBody").innerHTML=h;
}

// ===== 修改密码 =====
// v13.5：手机端左下角头像点击 → 账号信息弹窗（桌面直接显示完整信息，无需弹窗）
function showUserPopup(){
  if(window.innerWidth>=900)return;
  var u=STATE.user;if(!u)return;
  var rn=ROLE_LABELS[u.role]||u.role;
  showModal("<h3>我的账号</h3>"
    +"<div style=\"text-align:center;padding:4px 0 16px\"><div style=\"width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 10px\">"+esc((u.name||u.username||"?")[0])+"</div>"
    +"<div style=\"font-size:17px;font-weight:700\">"+esc(u.name)+"</div>"
    +"<div style=\"font-size:13px;color:var(--sub);margin-top:4px\">账号："+esc(u.username)+" ｜ 角色："+esc(rn)+"</div></div>"
    +"<div class=\"m-btns\" style=\"justify-content:center\"><button class=\"btn btn-ghost\" onclick=\"closeModal();showPwdModal()\">修改密码</button><button class=\"btn btn-danger\" onclick=\"closeModal();doLogout()\">退出登录</button></div>");
}
function showPwdModal(){
  showModal("<h3>修改密码</h3>"
    +"<div class=\"field\"><label>原密码</label><input id=\"pw_old\" type=\"password\"></div>"
    +"<div class=\"field\"><label>新密码</label><input id=\"pw_new\" type=\"password\"></div>"
    +"<div class=\"field\"><label>确认新密码</label><input id=\"pw_new2\" type=\"password\"></div>"
    +"<div class=\"m-btns\"><button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消</button><button class=\"btn btn-primary\" onclick=\"submitPwd()\">确认修改</button></div><div class=\"err\" id=\"pw_err\"></div>");
}
async function submitPwd(){
  var o=document.getElementById("pw_old").value,n1=document.getElementById("pw_new").value,n2=document.getElementById("pw_new2").value;
  if(!o||!n1){document.getElementById("pw_err").textContent="请填写完整";return;}
  if(n1!==n2){document.getElementById("pw_err").textContent="两次密码不一致";return;}
  try{await apiPost("/api/change_pwd",{old:o,pwd:n1});toast("密码已修改");closeModal();}catch(e){document.getElementById("pw_err").textContent=e.message;}
}

// ===== 数据统计 =====
async function renderStats(){
  var data=await apiGet("/api/stats");
  var st=data.stats||{};
  var role=STATE.user.role;
  var h="<div class=\"page-title\">数据统计</div><div class=\"page-desc\">按设备类型 / 卡类型 / 手机型号 / 设备情况统计"+(role==="member"?"（我的设备）":"（全部设备）")+"</div>";
  h+="<div class=\"kpi-row\">"+kpiCard("设备总数","#0a84ff",st.total)+kpiCard("在库","#34c759",st.available)+kpiCard("已领用","#7c5cff",st.inUse)+kpiCard("维修中","#ff9500",st.repairing)+"</div>";
  h+="<div class=\"card\"><div class=\"c-head\"><h3>设备情况</h3></div><div class=\"c-body\">"+bar("在库",st.available,st.total,"#34c759")+bar("已领用",st.inUse,st.total,"#7c5cff")+bar("维修中",st.repairing,st.total,"#ff9500")+bar("已报废",st.scrapped||0,st.total,"#ff3b30")+"</div></div>";
  h+="<div class=\"card\"><div class=\"c-head\"><h3>按设备类型</h3></div><div class=\"c-body\" style=\"padding:0\"><table><thead><tr><th>设备类型</th><th>总数</th><th>在库</th><th>已领用</th><th>维修中</th><th>已报废</th></tr></thead><tbody>";
  var bt=st.byType||{},keys=Object.keys(bt);
  if(!keys.length)h+="<tr><td colspan=\"6\" class=\"empty\">暂无数据</td></tr>";
  keys.forEach(function(k){
    var v=bt[k];
    h+="<tr><td><b>"+esc(k)+"</b></td><td class=\"num\">"+v.total+"</td><td class=\"num\">"+(v.available||0)+"</td><td class=\"num\">"+(v.in_use||0)+"</td><td class=\"num\">"+(v.repairing||0)+"</td><td class=\"num\">"+(v.scrapped||0)+"</td></tr>";
  });
  h+="</tbody></table></div></div>";
  h+="<div class=\"card\"><div class=\"c-head\"><h3>按手机卡类型</h3></div><div class=\"c-body\" style=\"padding:0\"><table><thead><tr><th>卡类型</th><th>数量</th></tr></thead><tbody>";
  var bc=st.byCard||{};var cks=Object.keys(bc);
  if(!cks.length)h+="<tr><td colspan=\"2\" class=\"empty\">暂无数据</td></tr>";
  cks.forEach(function(k){h+="<tr><td>"+esc(k)+"</td><td class=\"num\">"+bc[k]+"</td></tr>";});
  h+="</tbody></table></div></div>";
  h+="<div class=\"card\"><div class=\"c-head\"><h3>按手机型号</h3></div><div class=\"c-body\" style=\"padding:0\"><table><thead><tr><th>型号</th><th>数量</th></tr></thead><tbody>";
  var bm=st.byModel||{};var mks=Object.keys(bm);
  if(!mks.length)h+="<tr><td colspan=\"2\" class=\"empty\">暂无数据</td></tr>";
  mks.forEach(function(k){h+="<tr><td>"+esc(k)+"</td><td class=\"num\">"+bm[k]+"</td></tr>";});
  h+="</tbody></table></div></div>";
  document.getElementById("content").innerHTML=h;
}
function bar(label,val,total,color){
  var pct=total>0?Math.round(val/total*100):0;
  return "<div style=\"margin-bottom:12px\"><div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px\"><span>"+label+"</span><b class=\"num\">"+val+" ("+pct+"%)</b></div><div style=\"height:8px;background:#eef1f5;border-radius:99px;overflow:hidden\"><div style=\"height:100%;width:"+pct+"%;background:"+color+";border-radius:99px;transition:.4s\"></div></div></div>";
}

// ===== KPI =====
function kpiCard(label,color,val){
  return "<div class=\"kpi\"><div class=\"label\"><span class=\"dot\" style=\"background:"+color+"\"></span>"+label+"</div><div class=\"val num\">"+val+"</div></div>";
}
